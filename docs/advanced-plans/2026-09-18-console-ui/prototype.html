function state(c){const text=c.type==='verify'&&c.st==='done'?'已证实':c.type==='concl'&&c.st==='done'?'已证实':labels[c.st]||'待确认';return `<span class="status ${c.st}">${icon(statusIcon[c.st]||'circle')}${text}</span>`}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function openDrawer(title,body,kind='card') {opener=document.activeElement;if(innerWidth>900){$('map').style.width=$('map').getBoundingClientRect().width+'px';$('map-scroll').style.maxWidth='calc(100% - 424px)';}drawerKind=kind;$('drawer-title').textContent=title;$('drawer-body').innerHTML=body;$('drawer').hidden=false;$('close-drawer').focus();icons($('drawer'));if(selected)requestAnimationFrame(()=>{$('node-'+selected)?.scrollIntoView({block:'nearest',inline:'nearest'})})}
function closeDrawer(){const old=opener;$('drawer').hidden=true;drawerKind=null;$('map-scroll').style.maxWidth='';$('map').style.width='';$('map-scroll').scrollLeft=0;if(selected&&$('node-'+selected))$('node-'+selected).focus({preventScroll:true});else if(old?.isConnected)old.focus()}
function closePops(){for(const [id,b]of[['sessions-pop','sessions-btn'],['people-pop','people-btn']]){$(id).hidden=true;$(b).setAttribute('aria-expanded','false')}}
function togglePop(id,button){const next=$(id).hidden;closePops();$(id).hidden=!next;$(button).setAttribute('aria-expanded',String(next));if(next&&id==='people-pop'){$('people-search').focus();renderPeople()}}
function renderSessions(){ $('session-name').textContent=sessions.find(s=>s.id===current)?.title||'选择会话';$('session-list').innerHTML=sessions.length?sessions.map(s=>`<div class="session-row ${s.id===current?'active':''}"><button data-session="${esc(s.id)}">${esc(s.title)}<span class="sub mono">${esc(s.id)} · 演示会话</span></button><button class="btn icon-btn remove" data-remove="${esc(s.id)}" aria-label="停止观察 ${esc(s.id)}">${icon('x')}</button></div>`).join(''):'<p class="empty-small">还没有会话</p>'}
function renderPeople(){const q=$('people-search').value.toLowerCase();$('people-count').textContent=Object.keys(names).length;$('people-list').innerHTML=Object.entries(names).filter(([k,n])=>(k+n).toLowerCase().includes(q)).map(([k,n])=>`<button class="participant-row ${person===k?'active':''}" data-person="${k}">${icon(person===k?'check':'user-round')}${n}<small>${DATA.CARDS.filter(c=>(c.sig||[]).some(g=>g[1]===k)).length} 项署名</small></button>`).join('')||'<p class="empty-small">没有匹配的参与者</p>'}
function relatedIds(){if(!selected)return new Set();const ids=new Set([selected]);for(const e of DATA.EDGE_DEFS)if(e.f===selected||e.t===selected){ids.add(e.f);ids.add(e.t)}return ids}
const excerpts={M2:'分类批次与样式问答并发处理；默认并发 4。',CHIP:'Reviewer 的第二条建议尚未归类，具体内容待确认。',V3:'第 4 轮实现 · 本次 30 秒样本单条独跑。',V4:'样本逐项相等；全量比对仍在执行。',GAP:'全量判定比对结果；第二条审核建议的处置。'};
function node(c){const related=relatedIds(), highlight=person?(c.sig||[]).some(g=>g[1]===person):related.has(c.id);const meta=c.type==='goal'?'目标':c.type==='subgoal'?'验收要求':c.type.startsWith('concl')?'结论':c.type==='gap'?'缺口':c.type==='gap-chip'?'审核建议':c.type==='change'?'修改':c.type==='risk'?'风险':'验证';return `<article id="node-${c.id}" class="node ${c.type} ${selected===c.id?'selected':highlight?'related':selected||person?'dim':''}" tabindex="0" role="button" aria-label="聚焦：${esc(c.title)}" data-node="${c.id}" data-src="docs/design/mock-v2.html:${c.id}"><div class="node-meta"><span>${['change','risk','gap-chip','gap'].includes(c.type)?meta:''}</span>${state(c)}</div><h3>${esc(displayedTitle(c))}</h3>${c.type==='goal'?`<ul>${c.acc.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:`<p>${esc(excerpt(c))}</p>`}<div class="foot"><span class="signature">${c.sig?.length?esc(c.sig[0][0]+' · '+names[c.sig[0][1]]):c.who?esc(c.who):'未提供署名'}</span><button class="detail" data-detail="${c.id}" aria-label="查看详情：${esc(c.title)}">详情${icon('arrow-up-right')}</button></div></article>`}
function fold(key,title,list,sub=''){if(!list.length)return '';return `<div class="fold-wrap" data-src="docs/design/mock-v2.html:${key}"><button class="fold" data-fold="${key}" aria-expanded="${folds.has(key)}"><span class="fold-label">${icon(folds.has(key)?'chevron-down':'chevron-right')} ${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</span><span>${list.length}</span></button>${folds.has(key)?`<div class="fold-content">${list.map(node).join('')}</div>`:''}</div>`}
function inBranch(c){return !branch||c.id==='GOAL'||(branch==='S1'?['S1','M1','M2','V3','C1','R1'].includes(c.id):['S2','CHIP','R1','V4','C2','GAP'].includes(c.id))}
function renderMap(){const list=cards().filter(inBranch);const groups=[list.filter(c=>c.type==='goal'),list.filter(c=>c.type==='subgoal'),list.filter(c=>['change','gap-chip'].includes(c.type)),list.filter(c=>c.type==='verify'),list.filter(c=>c.type.startsWith('concl')||c.type==='gap')];const heads=['目标','验收要求','修改与问题','验证与证据','结果与缺口'];$('map').innerHTML='<svg class="edges" id="edges" aria-hidden="true"></svg>'+groups.map((pool,i)=>`<section class="column" data-src="docs/design/mock-v2.html:CARDS"><div class="column-head"><span>${heads[i]}</span></div>${pool.map(node).join('')}${i===2?fold('risks','已处理的风险',list.filter(c=>c.type==='risk')):''}${i===3?fold('regression','回归记录',DATA.RG_STEPS.filter(c=>c.st[tick]!=='hidden').map(c=>({...c,type:'verify',sig:[],sub:c.facts[0],st:c.st[tick]})),tick===3?'首跑 2/8 失败 · 修复后 8/8 通过':'失败与修复记录'):''}</section>`).join('');requestAnimationFrame(drawEdges)}
function drawEdges(){const map=$('map'),svg=$('edges');if(!svg||$('map-scroll').hidden)return;const root=map.getBoundingClientRect();svg.setAttribute('width',map.scrollWidth);svg.setAttribute('height',map.scrollHeight);let out='<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L5 3 L0 6" style="fill:#8fa49a;stroke:none"/></marker></defs>';for(const e of DATA.EDGE_DEFS){if(e.min!=null&&tick<e.min)continue;const a=$('node-'+e.f),b=$('node-'+e.t);if(!a||!b)continue;const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();if(br.left<=ar.left)continue;const x1=ar.right-root.left,y1=ar.top-root.top+Math.min(ar.height/2,66),x2=br.left-root.left,y2=br.top-root.top+Math.min(br.height/2,66);const active=selected&&(selected===e.f||selected===e.t);let d,lx,ly;if(x2-x1>100){const roof=39;d=`M${x1},${y1} H${x1+12} V${roof} H${x2-12} V${y2} H${x2}`;lx=(x1+x2)/2;ly=roof-6}else{d=`M${x1},${y1} C${x1+18},${y1} ${x2-18},${y2} ${x2},${y2}`;lx=(x1+x2)/2;ly=(y1+y2)/2-7}out+=`<path d="${d}" class="${active?'selected-edge':''}" marker-end="url(#arrow)"/>`;if(active||['GOAL','V3','V4'].includes(e.f))out+=`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(e.v)}</text>`}svg.innerHTML=out}
function render(){const live=DATA.LIVE[tick];$('live-now').innerHTML=live.now;$('live-next').textContent=live.next;$('sync-label').textContent=(stage==='draft'?'正在生成':stage==='error'?'同步失败':tick<3?'历史快照':'摘要')+` #${tick+1} · ${times[tick]}`;$('branch').value=branch;$('reset-btn').hidden=!(branch||selected||person);$('people-btn').classList.toggle('active',!!person);$('history-btn').classList.toggle('active',historyOpen);$('history-btn').setAttribute('aria-expanded',String(historyOpen));$('history').hidden=!historyOpen;$('history-range').value=tick;$('history-time').textContent=`${times[tick]} · #${tick+1}`;$('history-caption').textContent=tick<3?'正在查看历史':'最新快照';$('back-live').hidden=tick===3;$('context').textContent=person?'仅突出 '+names[person]+' 的署名记录':selected?'聚焦「'+(cardBy(selected)?.title||selected)+'」的直接关系 · Esc 退出':'';$('notice').hidden=true;
  if(stage==='pending'){$('notice').innerHTML=icon('circle-arrow-up')+'<span>有一份新摘要。当前阅读内容保持不变。</span><button class="btn outline" id="adopt-btn">查看新摘要</button>';$('notice').hidden=false}
  if(stage==='error'){$('notice').innerHTML=icon('circle-alert')+'<span>同步失败，仍在显示上一份摘要。</span><button class="btn outline" id="retry-btn">重试</button>';$('notice').hidden=false}
  if(stage==='draft'){$('notice').innerHTML=icon('circle-dashed')+'<span>正在生成第一版地图。已出现的内容可能变化。</span><button class="btn outline" id="finish-btn">预览生成完成</button>';$('notice').hidden=false}
  const empty=stage==='empty';$('summary').hidden=empty;$('map-scroll').hidden=empty;$('canvas-note').hidden=empty;$('empty').hidden=!empty;$('branch').disabled=empty;$('sync-btn').disabled=empty;$('history-btn').disabled=empty;$('people-btn').disabled=empty;
  if(empty){$('empty').innerHTML=icon('folder-open')+'<h2>还没有观察的会话</h2><p>添加一个 Claude Code、Codex 或 Cursor 会话，查看目标和解决路径。</p><button class="btn solid" id="empty-add">'+icon('plus')+'添加会话</button>';closeDrawer()}
  renderSessions();if(empty)$('session-name').textContent='选择会话';renderPeople();renderMap();if(!$('drawer').hidden&&drawerKind==='card'&&selected)showCard(selected,false);if(!$('drawer').hidden&&drawerKind==='summary')showSummary(false)
}
function showCard(id,focus=true){const c=cardBy(id);if(!c)return;const rels=DATA.EDGE_DEFS.filter(e=>(e.f===id||e.t===id)&&(e.min==null||tick>=e.min));const body=`<div class="row">${state(c)}<span class="spacer"></span><span class="mono muted">${times[tick]} · #${tick+1}</span></div><h3>摘要</h3><p>${esc(tick<3?excerpt(c):c.sub||c.title)}</p><h3>关键事实</h3><ul>${(tick<3?['旧设计示例未保存这份快照的完整事实，不以最新事实替代。']:(c.facts||[])).map(f=>`<li>${esc(f)}</li>`).join('')||'<li>暂无事实记录</li>'}</ul>${c.acc?'<h3>验收条件</h3><ul>'+c.acc.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}<h3>署名</h3><p>${c.sig?.length?c.sig.map(g=>esc(g[0]+'：'+g[2])).join('<br>'):esc(c.who||'未提供')}</p><h3>相关记录</h3>${rels.map(e=>{const other=e.f===id?e.t:e.f,target=cardBy(other);return `<button class="relation" data-jump="${other}"><span class="verb">${e.f===id?'→':'←'} ${esc(e.v)}</span><span>${esc(target?.title||'回归与修复记录')}</span></button>`}).join('')||'<p class="muted">没有已记录的关系</p>'}<div class="source">来源位置<br><span class="mono">${esc(c.ev||'未提供')}</span><br>本页展示仓内设计示例，未核验原始会话。</div>`;if(focus)openDrawer(displayedTitle(c),body);else{$('drawer-title').textContent=displayedTitle(c);$('drawer-body').innerHTML=body}}
function showSummary(focus=true){const live=DATA.LIVE[tick],body=['now','known','next'].map((k,i)=>`<h3>${['正在做','已证实的范围','仍需确认'][i]}</h3><p>${live[k]}</p>`).join('')+'<div class="source">来源：docs/design/mock-v2.html · LIVE<br>样本结果不替代全量验证。</div>';if(focus)openDrawer('当前进展',body,'summary');else $('drawer-body').innerHTML=body}
function setStage(v){stage=v;$('demo-state').value=v;selected=person=null;branch='';folds.clear();if(v==='draft')tick=0;else tick=3;if(v==='empty'){historyOpen=false;closePops()}render()}
$('sessions-btn').onclick=()=>togglePop('sessions-pop','sessions-btn');$('people-btn').onclick=()=>togglePop('people-pop','people-btn');$('people-search').oninput=renderPeople;
$('add-form').onsubmit=e=>{e.preventDefault();const id=$('session-input').value.trim();if(!id)return;if(!sessions.some(s=>s.id===id))sessions.push({id,title:'添加的演示会话'});current=id;$('session-input').value='';closePops();setStage('normal');toast('仅演示添加。地图仍使用仓内示例。')};
$('history-btn').onclick=()=>{historyOpen=!historyOpen;render()};$('history-range').oninput=e=>{tick=+e.target.value;if(selected&&!cardBy(selected)){closeDrawer();selected=null}render()};$('back-live').onclick=()=>{tick=3;render()};$('branch').onchange=e=>{branch=e.target.value;selected=person=null;render()};$('reset-btn').onclick=()=>{branch='';selected=person=null;render()};$('close-drawer').onclick=closeDrawer;$('summary-btn').onclick=()=>showSummary();
$('sync-btn').onclick=()=>{if(stage==='error')setStage('normal');else{stage='pending';$('demo-state').value='pending';render()};toast('同步为演示操作，不调用模型。')};$('sync-info').onclick=()=>openDrawer('同步详情',`<h3>当前阅读</h3><p>${tick<3?'历史快照':'最新摘要'} #${tick+1} · ${times[tick]}</p><h3>数据读到</h3><p class="mono">${times[tick]}（示例时间）</p><h3>摘要生成到</h3><p class="mono">${times[tick]}（示例时间）</p><h3>覆盖说明</h3><p>这份样稿使用仓内设计数据。真实页面将在这里保留采集范围、子会话匹配和数据说明；异常仍直接显示在主页面。</p>`,'info');$('demo-state').onchange=e=>setStage(e.target.value);
$('design-btn').onclick=()=>openDrawer('设计说明',`<h3>纸面工作台</h3><p>先读内容，再找操作。少颜色，少横条，少重复。</p><div class="swatches"><span style="background:#f6f7f7"></span><span style="background:#fff"></span><span style="background:#242a2b"></span><span style="background:#2c6657"></span><span style="background:#936019"></span></div><div class="design-rule"><strong>移除装饰</strong><p>无渐变、发光、大圆角、多色类型徽章。细边线区分层级，状态用文字和小图标。</p></div><div class="design-rule"><strong>合并次要入口</strong><p>参与者与历史放进地图工具栏。时间戳、完整进展和说明按需打开。</p></div><div class="design-rule"><strong>不删关键事实</strong><p>未知、失败、范围和未解决问题保留。历史重试折叠，不消失。</p></div><div class="design-rule"><strong>实现选择</strong><p>正式页面采用 Tailwind CSS + Lucide React，保留 React 与 Bun 构建。本页为离线样稿，尚未改正式页面。</p></div><div class="source">样例数据：docs/design/mock-v2.html<br>业务边界：docs/design/astra-review-v2.md<br>图标：Lucide，ISC License<br>目标待验证状态为本次设计修正；不把局部验证写成需求完成。</div>`,'design');
document.addEventListener('click',e=>{const t=e.target.closest('button,article');if(!e.target.closest('#session-host')&&!e.target.closest('#people-host'))closePops();if(!t)return;if(t.dataset.session){current=t.dataset.session;closePops();setStage('normal')}if(t.dataset.remove){sessions=sessions.filter(s=>s.id!==t.dataset.remove);if(current===t.dataset.remove)current=sessions[0]?.id||null;if(!sessions.length)setStage('empty');else renderSessions()}
  if(t.dataset.person){person=person===t.dataset.person?null:t.dataset.person;selected=null;closePops();render()}
  if(t.dataset.node){selected=selected===t.dataset.node?null:t.dataset.node;person=null;render()}
  if(t.dataset.detail){selected=t.dataset.detail;render();showCard(selected)}
  if(t.dataset.fold){folds.has(t.dataset.fold)?folds.delete(t.dataset.fold):folds.add(t.dataset.fold);renderMap()}
  if(t.dataset.jump){if(t.dataset.jump==='RG'){folds.add('regression');renderMap();toast('回归与修复记录已展开');closeDrawer()}else{const target=cardBy(t.dataset.jump);if(target){selected=target.id;branch='';if(target.id==='R1')folds.add('risks');render();showCard(target.id)}}}
  if(t.id==='empty-add')togglePop('sessions-pop','sessions-btn');if(t.id==='adopt-btn'){setStage('normal');toast('已切回最新示例摘要')}if(t.id==='retry-btn'||t.id==='finish-btn')setStage('normal')
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('drawer').hidden)closeDrawer();else{closePops();selected=person=null;branch='';render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-node]')){e.preventDefault();selected=e.target.dataset.node;render();showCard(selected)}});
new ResizeObserver(drawEdges).observe($('map-scroll'));icons();render();
</script>
</body>
</html>
