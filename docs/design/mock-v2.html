<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session 观察台 v2 · 需求解决地图</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1c212c; --line:#282e3b;
    --tx:#e7eaf0; --muted:#98a1b0; --dim:#626b7a;
    --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --red:#f87171; --teal:#2dd4bf; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Segoe UI",sans-serif;min-width:1560px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand .tag{font-size:10px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  .controls{display:flex;align-items:center;gap:10px;flex:1}
  .controls input[type=text]{flex:0 1 340px;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 12px;font-size:12px}
  .controls input[type=text]:focus{outline:none;border-color:var(--blue)}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--blue);color:#fff}
  button.primary{background:#2563eb;border-color:#2563eb;font-weight:600}
  button.mini{padding:3px 10px;font-size:11px;border-radius:6px}
  .stamps{margin-left:auto;text-align:right;font-size:10.5px;color:var(--dim);line-height:1.5;white-space:nowrap}
  .stamps b{color:var(--muted);font-weight:600}

  /* live progress card */
  .live{display:flex;gap:0;margin:12px 20px 0;border:1px solid #2b3a55;border-radius:12px;background:linear-gradient(180deg,#141b2a,#12161f);overflow:hidden}
  .live .lhead{flex:0 0 118px;display:flex;align-items:center;justify-content:center;background:#182338;font-weight:700;font-size:13px;color:#9fc1f7;letter-spacing:1px}
  .live .lhead .pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:9px;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.3}}
  .live .lbody{flex:1;display:grid;grid-template-columns:1fr 1.4fr 1fr}
  .live .lcell{padding:10px 16px;border-left:1px solid #223049}
  .live .lcell .k{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-bottom:3px}
  .live .lcell .v{font-size:13px;color:#dbe3ef}
  .live .lcell .v b{color:#fff}

  /* signature legend */
  .sigbar{display:flex;align-items:center;gap:10px;margin:10px 20px 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .sigbar .lab{letter-spacing:1px;font-size:10.5px}
  .sigchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;transition:.15s;color:var(--muted)}
  .sigchip:hover{border-color:var(--blue);color:var(--tx)}
  .sigchip.on{border-color:var(--violet);color:#fff;background:#221d38}
  .sigchip .n{font-size:10px;color:var(--dim)}
  .sigchip .cdot{width:7px;height:7px;border-radius:50%}

  /* canvas */
  .wrap{position:relative;margin:14px 20px 0;height:700px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(1000px 500px at 22% 0%,#151b28 0%,var(--bg) 65%);overflow:hidden}
  .zone{position:absolute;left:14px;right:14px;border:1px dashed #232a38;border-radius:12px;pointer-events:none}
  .zone .zh{position:absolute;top:-11px;left:22px;background:var(--bg);padding:0 10px;font-size:11px;color:var(--dim);letter-spacing:2px}
  .colhead{position:absolute;top:14px;font-size:11px;color:var(--dim);letter-spacing:2px}
  svg.edges{position:absolute;inset:0;z-index:1;pointer-events:none}
  svg.edges text{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#0e1014;stroke-width:4px}
  svg.edges path{transition:opacity .5s}
  svg.edges .off{opacity:0}

  .card{position:absolute;z-index:2;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:9px 12px 7px;cursor:pointer;transition:opacity .5s,box-shadow .3s,border-color .3s}
  .card.off{opacity:0;pointer-events:none}
  .card:hover{border-color:#465170}
  .card .ctag{display:inline-block;font-size:9.5px;letter-spacing:1px;padding:1px 7px;border-radius:4px;margin-bottom:4px;font-weight:700}
  .card h4{font-size:13.5px;font-weight:650;line-height:1.3}
  .card .sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
  .card ul.acc{margin:6px 0 2px 16px;font-size:11.5px;color:#c3cbd8}
  .card ul.acc li{margin:2px 0}
  .card .sig{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .card .sig span{font-size:10px;color:var(--dim);background:#0d1017;border:1px solid #232a38;border-radius:5px;padding:1px 7px;cursor:pointer}
  .card .sig span:hover{color:var(--tx);border-color:#3a4459}
  .card .sig span b{color:var(--muted);font-weight:600}
  .card .note{font-size:10.5px;color:var(--dim);margin-top:5px}
  .card .stbadge{position:absolute;top:-9px;right:10px;font-size:9.5px;padding:1px 8px;border-radius:99px;font-weight:700;letter-spacing:1px}

  /* type styling */
  .card.goal{background:linear-gradient(160deg,#17233c,#131a2a);border-color:#3b5bdb88}
  .card.goal h4{font-size:15px;color:#dbe7ff}
  .card.subgoal{border-color:#2c4a7c}
  .card.change{}
  .card.risk{border-color:#8a6420;background:#1d1a10}
  .card.risk.resolved{border-color:#2f5c48;background:#111b16}
  .card.verify{border-color:#1f4f4a}
  .card.verify.failed{border-color:#7c3333;background:#1d1212}
  .card.concl{background:linear-gradient(160deg,#122019,#101613)}
  .card.concl.partial{background:linear-gradient(160deg,#211f10,#16140d)}
  .card.gap{border-style:dashed;border-color:#3a4459;background:#12141a}
  .st-doing{background:#1e3a5c;color:#93c5fd}
  .st-done{background:#14532d;color:#86efac}
  .st-failed{background:#5c1d1d;color:#fca5a5}
  .st-partial{background:#574308;color:#fde68a}
  .st-risk{background:#574308;color:#fde68a}
  .st-resolved{background:#14532d;color:#86efac}

  .card.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px #60a5fa88}100%{box-shadow:0 0 0 3px transparent}}

  /* folded regression group */
  .rg{position:absolute;z-index:3}
  .rgchip{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;transition:.2s}
  .rgchip:hover{border-color:#465170}
  .rgchip .arr{color:var(--dim);font-size:10px}
  .rgchip .rgst{font-size:9.5px;padding:1px 8px;border-radius:99px;font-weight:700}
  .rgbody{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:rgba(16,19,26,.97);padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .rgstep{display:flex;align-items:flex-start;gap:8px;padding:5px 2px;font-size:11.5px;color:#c3cbd8;cursor:pointer;border-radius:6px}
  .rgstep:hover{background:#1a2030}
  .rgstep .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
  .rgstep .who{color:var(--dim);font-size:10px;margin-left:auto;white-space:nowrap}
  .rgarrow{text-align:center;color:#3a4459;font-size:10px;line-height:1;margin:1px 0}
  .rgnote{font-size:10px;color:var(--dim);border-top:1px dashed #2a3040;margin-top:7px;padding-top:6px;line-height:1.5}

  /* history bar */
  .hist{display:flex;align-items:center;gap:14px;margin:12px 20px 0;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:12px;color:var(--muted)}
  .hist input[type=range]{flex:1;accent-color:#3b82f6}
  .hist .banner{display:none;align-items:center;gap:10px;background:#3a2b10;border:1px solid #8a6420;color:#fde68a;border-radius:8px;padding:4px 12px;font-size:11.5px;font-weight:600}
  .hist.viewing .banner{display:inline-flex}

  /* drawer */
  #drawer{position:fixed;right:0;top:0;bottom:0;width:368px;background:var(--panel);border-left:1px solid var(--line);z-index:60;padding:20px;transform:translateX(103%);transition:transform .25s;overflow-y:auto}
  #drawer.open{transform:none}
  #drawer h3{font-size:15px;margin-bottom:2px}
  #drawer .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  #drawer .kv{display:flex;gap:8px;font-size:12px;margin:7px 0}
  #drawer .kv b{color:var(--dim);font-weight:500;flex:0 0 78px}
  #drawer .evbox{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;color:#a5b4fc;margin:10px 0;word-break:break-all}
  #drawer ul{margin:6px 0 0 18px;font-size:12.5px;color:#d1d5db}
  #drawer li{margin:4px 0}
  #drawer .close{position:absolute;top:12px;right:12px;border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer}

  .focusmode .card:not(.hl){opacity:.13;pointer-events:none}
  .focusmode svg.edges path:not(.hl){opacity:.04}
  .focusmode svg.edges text:not(.hl){opacity:.05}
  .credit{margin:10px 20px 26px;font-size:11px;color:#4a5261;text-align:right}
</style>
</head>

  facts:['按 (mask_hash, text) 稳定排序','解决 R1（当时标「待验证」）'],ev:'merge_shards() · Edit×4'},
 {id:'V2',dot:'#34d399',title:'重跑：8/8 PASS',who:'执行 Programmer · 报告 后台哨兵',st:['hidden','hidden','doing','done'],changed:[8],
  facts:['哨兵捕获 ROUND4 DONE 标记后主线收束','回归 PASS 不自动作为「判定一致」证据（范围有限）'],ev:'metrics.json · sentinel stdout'},
];
const EDGE_DEFS=[
 {f:'GOAL',t:'S1',v:'拆成',fa:'r',ta:'l'},
 {f:'GOAL',t:'S2',v:'拆成',fa:'r',ta:'l'},
 {f:'S1',t:'M1',v:'采用',fa:'r',ta:'l'},
 {f:'S1',t:'M2',v:'采用',fa:'r',ta:'l'},
 {f:'R1',t:'M1',v:'妨碍',fa:'t',ta:'b',kind:'risk'},
 {f:'M1',t:'RG',v:'检查',fa:'b',ta:'t',min:1},
 {f:'RG',t:'R1',v:'解决（已验证）',fa:'t',ta:'b',kind:'solve',min:3},
 {f:'S1',t:'V3',v:'检查',fa:'r',ta:'l',min:2},
 {f:'V3',t:'C1',v:'支持',fa:'r',ta:'l',kind:'solve',min:3},
 {f:'S2',t:'V4',v:'检查',fa:'r',ta:'l'},
 {f:'V4',t:'C2',v:'支持·部分',fa:'r',ta:'l',kind:'solve',min:3},
 {f:'C2',t:'GAP',v:'留下缺口',fa:'b',ta:'t',kind:'risk',min:3},
];
const LIVE=[
 {now:'<b>Programmer</b> 实现分片并发（C31）与 VLM 并发（C32/C33）',known:'验收条件已定义：≤120s · 判定不变 · 回归全过',nextK:'下一项验证',next:'首轮回归（8 条 10 秒片）'},
 {now:'<b>Programmer</b> 处理回归失败；<b>Reviewer</b> 提出批间排序风险',known:'首轮回归 <b>2/8 失败</b>——批间合并顺序抖动',nextK:'下一项验证',next:'修复后重跑回归'},
 {now:'<b>Programmer</b> 修复批间合并排序（与风险 R1 定位一致）',known:'风险 R1 与失败互相印证；修复已提交待重验',nextK:'下一项验证',next:'重跑回归 + 性能测量'},
 {now:'<b>Task B1</b> 全量基线比对后台执行中',known:'重跑 <b>8/8 PASS</b> · 30 秒片 <b>411s→118s</b> 达标 · 样本比对逐项相等',nextK:'仍需确认',next:'全量判定比对 · Reviewer 第 2 条建议归类'},
];
const SNAPNOTE=['并行开工：两路方案实现中','首轮回归失败 · 风险浮出','修复与重验进行中','耗时证实 · 判定部分证实 · 2 缺口'];
const TIMES=['21:18','21:52','22:04','22:26'];

/* ═══════════ 渲染 ═══════════ */
const wrap=document.getElementById('wrap'), esvg=document.getElementById('edges');
let dataTick=0, viewTick=0, syncN=0, prevView=-1, selAgent=null, rgOpen=false;
const NS='http://www.w3.org/2000/svg';
const cardOf=id=>CARDS.find(c=>c.id===id);
const RGX=626,RGY=436,RGW=300;

function anchor(c,side){
  const map={l:[c.x,c.y+c.h/2],r:[c.x+c.w,c.y+c.h/2],t:[c.x+c.w/2,c.y],b:[c.x+c.w/2,c.y+c.h]};
  return map[side];
}
function drawEdges(){
  esvg.setAttribute('width',wrap.clientWidth);esvg.setAttribute('height',wrap.clientHeight);
  esvg.innerHTML='';
  const verbColor={拆成:'#5f6b7e',采用:'#5f6b7e',检查:'#5f6b7e',妨碍:'#fbbf24',解决:'#34d399','支持':'#2dd4bf','支持·部分':'#2dd4bf','留下缺口':'#6b7280'};
  EDGE_DEFS.forEach(ed=>{
    if(viewTick<(ed.min||0))return;
    const a=cardOf(ed.f),b=cardOf(ed.t);
    if(!a||!b)return;
    if(isHidden(a)||isHidden(b))return;
    const [x1,y1]=anchor(a,ed.fa),[x2,y2]=anchor(b,ed.ta);
    const hor=(ed.fa==='l'||ed.fa==='r');
    const c1=hor?[x1+(x2>x1?40:-40),y1]:[x1,y1+(y2>y1?40:-40)];
    const c2=hor?[x2-(x2>x1?40:-40),y2]:[x2,y2-(y2>y1?40:-40)];
    const col=ed.kind==='risk'?'#fbbf24':ed.kind==='solve'?'#34d399':'#5f6b7e';
    const dash=ed.kind==='risk'?'5 4':'none';
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M ${x1} ${y1} C ${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${x2} ${y2}`);
    p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','1.7');
    p.setAttribute('stroke-dasharray',dash);
    p.dataset.f=ed.f;p.dataset.t=ed.t;
    esvg.appendChild(p);
    const mx=(x1+x2)/2+(hor?0:14),my=(y1+y2)/2+(hor?-8:0);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',mx);t.setAttribute('y',my);t.setAttribute('text-anchor','middle');
    t.setAttribute('fill',verbColor[ed.v]||col);t.dataset.f=ed.f;t.dataset.t=ed.t;
    t.textContent=ed.v;
    esvg.appendChild(t);
  });
}
function isHidden(c){return stateOf(c)==='hidden';}
function stateOf(c){return c.st[Math.min(viewTick,c.st.length-1)]||'hidden';}

function buildCards(){
  wrap.querySelectorAll('.card,.rg').forEach(n=>n.remove());
  CARDS.forEach(c=>{
    if(c.type==='group'){buildRG();return;}
    const d=document.createElement('div');
    d.className='card '+c.type;d.id='c-'+c.id;
    d.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w}px;`;
    const stTxt={doing:'进行中',done:'已证实',failed:'失败',partial:'部分证实',risk:'待确认',resolved:'已解决'};
    const s=stateOf(c);
    const badge=s!=='hidden'&&stTxt[s]?`<span class="stbadge st-${s}">${stTxt[s]}</span>`:'';
    let html=`${badge}${c.tag?`<span class="ctag" style="background:#232a38;color:${tagColor(c)}">${c.tag}</span>`:''}<h4>${c.title}</h4>`;
    if(c.sub)html+=`<div class="sub">${c.sub}</div>`;
    if(c.acc)html+=`<ul class="acc">${c.acc.map(a=>`<li>${a}</li>`).join('')}</ul>`;
    if(c.sig&&c.sig.length)html+=`<div class="sig">${c.sig.map((g,i)=>`<span data-agent="${g[1]}">${g[0]} · <b>${AGENTS[g[1]].name.split(' · ')[0]}</b></span>`).join('')}</div>`;
    d.innerHTML=html;
    d.addEventListener('click',e=>{if(e.target.dataset.agent){focusAgent(e.target.dataset.agent);e.stopPropagation();return;}openDrawer(c);});
    wrap.appendChild(d);
  });
  /* gap-chip 简化样式 */
  const chip=document.getElementById('c-CHIP');
  if(chip){chip.style.cssText+='padding:5px 12px;display:flex;align-items:center;';chip.style.borderStyle='dashed';}
}
function tagColor(c){return {goal:'#9fc1f7',subgoal:'#9fc1f7',change:'#b7c0cf',risk:'#fde68a',verify:'#7ee6d8',concl:'#86efac',gap:'#9aa3b2','gap-chip':'#8b93a3'}[c.type]||'#b7c0cf';}

function buildRG(){
  const s=stateOf({st:cardOf('RG').st});
  const g=document.createElement('div');g.className='rg';g.id='c-RG';
  g.style.cssText=`left:${RGX}px;top:${RGY}px;width:${RGW}px;`;
  const chipSt={failed:['st-failed','首轮 2/8 失败'],doing:['st-doing','修复 · 重验中'],done:['st-done','重跑 PASS ✓']}[s]||['st-doing','进行中'];
  g.innerHTML=`<div class="rgchip" id="rgChip">
      <span style="font-weight:650">回归首轮失败 → 修复 → 重验</span>
      <span class="rgst ${chipSt[0]}">${chipSt[1]}</span><span class="arr">${rgOpen?'▾':'▸'} 展开</span>
    </div>
    ${rgOpen?`<div class="rgbody">${RG_STEPS.map((r,i)=>
      `${i?'<div class="rgarrow">▼</div>':''}
       <div class="rgstep" data-rg="${r.id}"><span class="dot" style="background:${stateOf(r)==='hidden'?'#333c4c':r.dot}"></span>
       <span>${r.title}</span><span class="who">${r.who}</span></div>`).join('')}
      <div class="rgnote">注：回归 PASS 不自动作为「判定一致」的证据（范围有限）；「检测到产物标记」只证明标记存在，不证明测试通过。</div>
    </div>`:''}`;
  g.querySelector('#rgChip').addEventListener('click',e=>{rgOpen=!rgOpen;render(false);e.stopPropagation();});
  g.querySelectorAll('.rgstep').forEach(el=>el.addEventListener('click',e=>{
    openDrawer(RG_STEPS.find(r=>r.id===el.dataset.rg));e.stopPropagation();}));
  wrap.appendChild(g);
}

function render(animate){
  const changed=animate?new Set():null;
  if(animate&&prevView>=0){
    CARDS.concat(RG_STEPS).forEach(c=>{
      const a=c.st[Math.min(prevView,c.st.length-1)],b=c.st[Math.min(viewTick,c.st.length-1)];
      if(a!==b)c.changed&&c.changed.forEach(t=>{if(t===viewTick)changed.add(c.id);});
    });
  }
  buildCards();drawEdges();
  document.querySelectorAll('.card,.rg').forEach(n=>{if(changed&&changed.has(n.id.replace('c-','')))n.classList.add('flash');});
  /* 署名 chips */
  const counts={};CARDS.concat(RG_STEPS).forEach(c=>(c.sig||[]).forEach(g=>{if(stateOf(c)!=='hidden')counts[g[1]]=(counts[g[1]]||0)+1;}));
  document.getElementById('sigchips').innerHTML=Object.entries(AGENTS).map(([k,a])=>{
    const on=selAgent===k?' on':'';
    const dots=(CARDS.concat(RG_STEPS)).some(c=>stateOf(c)!=='hidden'&&(c.sig||[]).some(g=>g[1]===k));
    return `<span class="sigchip${on}" data-k="${k}"><span class="cdot" style="background:${a.color};opacity:${dots?1:.25}"></span>${a.name.split(' · ')[0]}<span class="n">${counts[k]||0}卡</span></span>`;
  }).join('');
  document.querySelectorAll('.sigchip').forEach(ch=>ch.onclick=e=>{e.stopPropagation();focusAgent(selAgent===ch.dataset.k?null:ch.dataset.k);});
  /* live card */
  const L=LIVE[Math.min(dataTick,LIVE.length-1)];
  const inHistory=viewTick<dataTick;
  document.getElementById('lvNow').innerHTML=inHistory?LIVE[viewTick].now:L.now;
  document.getElementById('lvKnown').innerHTML=inHistory?LIVE[viewTick].known:L.known;
  document.getElementById('lvNextK').textContent=inHistory?LIVE[viewTick].nextK:L.nextK;
  document.getElementById('lvNext').innerHTML=inHistory?LIVE[viewTick].next:L.next;
  /* stamps */
  document.getElementById('stData').textContent=TIMES[Math.min(dataTick,TIMES.length-1)];
  document.getElementById('stSum').textContent=TIMES[Math.min(dataTick,TIMES.length-1)];
  /* history UI */
  const hs=document.getElementById('hslider');hs.value=viewTick;
  document.getElementById('hlabel').textContent=inHistory?`历史 · 同步 #${viewTick}`:`实时 · 同步 #${syncN}`;
  document.getElementById('hist').classList.toggle('viewing',inHistory);
  document.getElementById('stat').innerHTML=inHistory
    ?`查看历史 · 最新数据 #${dataTick}`
    :(dataTick>=3?`观察完成 · <b style="color:var(--green)">done</b> · ${SNAPNOTE[3]}`:`同步 #${syncN} · ${SNAPNOTE[dataTick]}`);
  focusAgent(selAgent,true);
  prevView=viewTick;
}

/* 署名聚焦：高亮该 agent 的卡片与相关边 */
function focusAgent(k,keep){
  selAgent=k;
  wrap.classList.toggle('focusmode',!!k);
  document.querySelectorAll('.hl').forEach(n=>n.classList.remove('hl'));
  document.querySelectorAll('.sigchip').forEach(ch=>ch.classList.toggle('on',ch.dataset.k===k));
  if(!k)return;
  CARDS.concat(RG_STEPS).forEach(c=>{
    if((c.sig||[]).some(g=>g[1]===k)&&stateOf(c)!=='hidden'){
      const n=document.getElementById('c-'+c.id);if(n)n.classList.add('hl');
    }});
  esvg.querySelectorAll('path').forEach(p=>{
    const fa=cardOf(p.dataset.f),ta=cardOf(p.dataset.t);
    if(!fa||!ta)return;
    const hit=(fa.sig||[]).some(g=>g[1]===k)||(ta.sig||[]).some(g=>g[1]===k);
    if(hit){p.classList.add('hl');}
  });
}
wrap.addEventListener('click',e=>{if(e.target===wrap||e.target.classList.contains('zone')||e.target.tagName==='svg'){selAgent=null;wrap.classList.remove('focusmode');document.querySelectorAll('.hl').forEach(n=>n.classList.remove('hl'));document.querySelectorAll('.sigchip').forEach(ch=>ch.classList.remove('on'));closeDrawer();}});

/* 证据抽屉 */
function openDrawer(c){
  const stTxt={doing:'🔵 进行中',done:'✅ 已证实',failed:'🔴 失败',partial:'🟡 部分证实',risk:'🟡 待确认',resolved:'✅ 已解决',hidden:'·'};
  const s=stateOf(c);
  document.getElementById('dBody').innerHTML=
   `<h3>${c.title}</h3><div class="sub">${c.tag||''} · 状态：${stTxt[s]||s}</div>
    ${(c.sig&&c.sig.length)?`<div class="kv"><b>署名</b><span>${c.sig.map(g=>`${g[0]}：${AGENTS[g[1]].name}`).join('；')}</span></div>`:''}
    <div class="evbox mono">${c.ev||'—'}</div>
    <div class="kv"><b>关键事实</b></div>
    <ul>${(c.facts||[]).map(f=>`<li>${f}</li>`).join('')||'<li>—</li>'}</ul>
    ${c.acc?`<div class="kv" style="margin-top:10px"><b>验收条件</b></div><ul>${c.acc.map(a=>`<li>${a}</li>`).join('')}</ul>`:''}`;
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}
document.getElementById('dClose').onclick=closeDrawer;

/* ═══════════ 管线动画 + 同步 ═══════════ */
const PIPE=['定位 session 文件','解析 JSONL 事件流','拼接 agent 树（Task + 后台派生）','归入：目标 / 工作 / 问题 / 验证 / 结论','LLM 压缩 → 带署名的卡片','渲染解决地图'];
function runPipe(cb){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.8);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center';
  ov.innerHTML=`<div style="width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px">
    <h4 style="font-size:14px;margin-bottom:14px">正在重建解决地图 <span class="mono muted">· ${document.getElementById('sid').value.slice(0,14)}…</span></h4>
    ${PIPE.map((s,i)=>`<div class="pstep" id="ps${i}" style="display:flex;gap:10px;padding:5px 0;font-size:13px;color:var(--dim)"><span class="mark">○</span>${s}</div>`).join('')}</div>`;
  document.body.appendChild(ov);
  let i=0;
  const iv=setInterval(()=>{
    if(i>0){const pr=ov.querySelector('#ps'+(i-1));pr.style.color='var(--tx)';pr.querySelector('.mark').textContent='✓';pr.querySelector('.mark').style.color='var(--green)';}
    if(i>=PIPE.length){clearInterval(iv);setTimeout(()=>{ov.remove();cb&&cb();},260);return;}
    const cur=ov.querySelector('#ps'+i);cur.style.color='var(--blue)';i++;
  },280);
}
function sync(){
  if(dataTick>=3)return;
  dataTick++;syncN++;
  viewTick=dataTick; /* 若在看历史则不跟随 */
  render(true);
  if(dataTick>=3)document.getElementById('auto').checked=false;
}
document.getElementById('btnStart').onclick=()=>{
  dataTick=0;syncN=0;viewTick=0;prevView=-1;rgOpen=false;closeDrawer();
  runPipe(()=>render(false));
};
document.getElementById('btnSync').onclick=sync;
document.getElementById('sid').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btnStart').click();});
let autoIv=null;
document.getElementById('auto').addEventListener('change',e=>{
  clearInterval(autoIv);
  if(e.checked)autoIv=setInterval(()=>{dataTick<3?sync():(e.target.checked=false,clearInterval(autoIv));},4500);
  else clearInterval(autoIv);
});
/* 历史滑条 */
document.getElementById('hslider').addEventListener('input',e=>{viewTick=+e.target.value;render(false);});
document.getElementById('hback').onclick=()=>{viewTick=dataTick;render(false);};

/* init：直接以最终状态铺开，便于审阅；按「开始观察」重放 */
dataTick=3;viewTick=3;render(false);
</script>
</body>
