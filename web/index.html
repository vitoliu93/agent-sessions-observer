<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session 观察台 · 需求解决地图</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1c212c; --line:#282e3b;
    --tx:#e7eaf0; --muted:#98a1b0; --dim:#8993a3;
    --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --red:#f87171; --teal:#2dd4bf; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Segoe UI",sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:60}
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand .tag{font-size:10px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  /* 会话切换器 */
  .switcher{position:relative}
  #swBtn{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:space-between}
  #swBtn .sid{font-size:12px}
  #swBtn .caret{color:var(--dim);font-size:10px}
  .menu{position:absolute;top:calc(100% + 8px);left:0;width:380px;max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:8px;display:none;z-index:70}
  .menu.open{display:block}
  .swrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .swrow:hover{background:var(--panel2)}
  .swrow.active{border-color:#3b5bdb66;background:#141b2c}
  .swrow .sid{font-size:12.5px;font-weight:600}
  .swrow .meta{font-size:10.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .swrow .rm{border:none;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:5px;opacity:0}
  .swrow:hover .rm{opacity:1}
  .swrow .rm:hover{color:var(--red);background:#2a1a1a}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.done{background:var(--green)} .dot.err{background:var(--red)}
  .dot.work{background:var(--blue);animation:blink 1.1s infinite} .dot.empty{background:#475569}
  @keyframes blink{50%{opacity:.25}}
  .swAdd{display:flex;gap:8px;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
  .swAdd input{flex:1;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px}
  .swAdd button{padding:6px 14px;font-size:12px}
  .controls{display:flex;align-items:center;gap:10px;flex:1}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--blue);color:#fff}
  button.primary{background:#2563eb;border-color:#2563eb;font-weight:600}
  .stamps{margin-left:auto;text-align:right;font-size:10.5px;color:var(--dim);line-height:1.5;white-space:nowrap}
  .stamps b{color:var(--muted)}
  .spin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);animation:blink 1.2s infinite;margin-right:6px}

  /* ── 当前进展：三格限量，clamp 2 行，点击展开全文 ── */
  .live{display:flex;margin:12px 20px 0;border:1px solid #2b3a55;border-radius:12px;background:linear-gradient(180deg,#141b2a,#12161f);overflow:hidden}
  .live .lhead{flex:0 0 118px;display:flex;align-items:center;justify-content:center;background:#182338;font-weight:700;font-size:13px;color:#9fc1f7;letter-spacing:1px}
  .live .lhead .pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:9px;animation:blink 1.4s infinite}
  .live .lbody{flex:1;display:grid;grid-template-columns:1fr 1.4fr 1fr}
  .live .lcell{padding:9px 14px;border-left:1px solid #223049;cursor:pointer;min-width:0}
  .live .lcell .k{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-bottom:3px}
  .live .lcell .v{font-size:12.5px;color:#dbe3ef;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
  .live .lcell.open .v{-webkit-line-clamp:unset;display:block}
  .live .lcell .hint{font-size:9.5px;color:var(--dim);margin-top:2px}
  .live .lcell.open .hint{display:none}

  /* ── 参与者：摘要一行 + 面板，不铺满横带 ── */
  .sigbar{position:relative;display:flex;align-items:center;gap:10px;margin:10px 20px 0;font-size:12px;color:var(--dim)}
  .sigchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--muted)}
  .sigchip.on{border-color:var(--violet);color:#fff;background:#221d38}
  .sigchip .cdot{width:7px;height:7px;border-radius:50%}
  .sigchip .n{font-size:10px;color:var(--dim)}
  #pcPanel{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:60vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:10px;display:none;z-index:70}
  #pcPanel.open{display:block}
  #pcPanel input{width:100%;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:8px}
  #pcList{display:flex;flex-direction:column;gap:4px}
  .pcrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted)}
  .pcrow:hover{background:var(--panel2)} .pcrow.on{background:#221d38;color:#fff}
  .pcrow .n{margin-left:auto;font-size:10px;color:var(--dim)}

  /* ── 地图画布：列宽实测，卡片高度实测 ── */
  .wrap{position:relative;margin:14px 20px 0;border:1px solid var(--line);border-radius:14px;background:radial-gradient(1000px 500px at 22% 0%,#151b28 0%,var(--bg) 65%)}
  .colhead{position:absolute;top:14px;font-size:11px;color:var(--dim);letter-spacing:2px;z-index:1}
  .zone{position:absolute;border:1px dashed #232a38;border-radius:12px;pointer-events:none}
  .zone .zh{position:absolute;top:-11px;left:22px;background:var(--bg);padding:0 10px;font-size:11px;color:var(--dim);letter-spacing:2px}
  .zone .zh button{pointer-events:auto;border:none;background:none;color:var(--dim);font-size:10px;cursor:pointer;padding:0 4px;letter-spacing:1px}
  .zone .zh button:hover{color:var(--blue)}
  svg.edges{position:absolute;inset:0;z-index:1;pointer-events:none}
  svg.edges text{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#0e1014;stroke-width:4px;display:none}
  svg.edges text.show{display:inline}
  svg.edges path.ctx{opacity:.25}svg.edges path.main{opacity:.65}svg.edges path.hl{opacity:1}
  svg.edges path{transition:opacity .2s,stroke .2s}

  /* ── 卡片：四层结构，高度自适应，只有标题/摘要有意省略 ── */
  .card{position:absolute;z-index:2;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;transition:opacity .4s;display:grid;gap:4px}
  .card:hover{border-color:#465170}
  .card:focus-visible,.card.sel{outline:2px solid var(--blue);outline-offset:2px}
  .clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
  .card .meta{display:flex;align-items:center;gap:7px;min-width:0}
  .card .ctag{font-size:9.5px;letter-spacing:1px;padding:1px 7px;border-radius:4px;font-weight:700;background:#232a38;flex:none}
  .card .stbadge{font-size:9.5px;padding:1px 8px;border-radius:99px;font-weight:700;flex:none}
  .card h4{font-size:14px;font-weight:650;line-height:20px}
  .card .fact{font-size:13px;color:var(--muted);line-height:18px}
  .card ul.acc{margin:2px 0 0 16px;font-size:11.5px;color:#c3cbd8}
  .card .foot{display:flex;align-items:center;gap:8px;min-width:0;min-height:20px}
  .card .sig1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--dim)}
  .card .sig1 b{color:var(--muted);font-weight:600}
  .card .more{font-size:10px;color:var(--dim);flex:none}
  .card .dtl{margin-left:auto;flex:none;border:none;background:none;color:var(--teal);font-size:10.5px;cursor:pointer;padding:2px 6px;border-radius:6px}
  .card .dtl:hover{background:#0f2725;color:#8ef0e2}
  .card .st-doing{background:#1e3a5c;color:#93c5fd}
  .card .st-done,.card .st-resolved{background:#14532d;color:#86efac}
  .card .st-failed{background:#5c1d1d;color:#fca5a5}
  .card .st-partial,.card .st-risk{background:#574308;color:#fde68a}
  .card.goal{background:linear-gradient(160deg,#17233c,#131a2a);border-color:#3b5bdb88}
  .card.subgoal{border-color:#2c4a7c}
  .card.risk{border-color:#8a6420;background:#1d1a10}
  .card.risk.resolved{border-color:#2f5c48;background:#111b16}
  .card.verify{border-color:#1f4f4a}
  .card.verify.failed{border-color:#7c3333;background:#1d1212}
  .card.concl{background:linear-gradient(160deg,#122019,#101613)}
  .card.concl.partial{background:linear-gradient(160deg,#211f10,#16140d)}
  .card.gap{border-style:dashed;border-color:#3a4459;background:#12141a}
  .card.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px #60a5fa88}100%{box-shadow:0 0 0 3px transparent}}

  /* ── 折叠入口：虚线 UI 容器，不是业务节点 ── */
  .foldentry{position:absolute;z-index:2;border:1.5px dashed #33405a;border-radius:11px;background:rgba(22,26,34,.55);padding:10px 12px;cursor:pointer;color:var(--muted);text-align:left;font:inherit}
  .foldentry>span{display:block}
  .foldentry:hover{border-color:#4a5b7d;background:#161c28}
  .foldentry .t1{font-size:12px;font-weight:600;color:#aab6c8}
  .foldentry .t1 b{color:var(--tx)}
  .foldentry .t2{font-size:10.5px;color:var(--dim);margin-top:3px}.foldentry .uns{color:var(--amber)}
  .foldentry .go{margin-top:5px;font-size:10.5px;color:var(--teal)}

  /* ── 聚焦模式：选中/署名筛选时无关卡降透明，但保持可点击 ── */
  .focusmode .card:not(.hl){opacity:.3}
  .focusmode svg.edges path:not(.hl){opacity:.05}
  .focusmode svg.edges text:not(.hl){opacity:0}

  .rgbody{position:absolute;z-index:5;border:1px solid var(--line);border-radius:10px;background:rgba(16,19,26,.98);padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .rgstep{display:flex;gap:8px;padding:5px 2px;font-size:11.5px;color:#c3cbd8;cursor:pointer;border-radius:6px;align-items:flex-start}
  .rgstep .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
  .rgstep .who{color:var(--dim);font-size:10px;margin-left:auto;white-space:nowrap}
  .rgarrow{text-align:center;color:#3a4459;font-size:10px;line-height:1;margin:1px 0}

  /* ── 历史：默认收起 ── */
  .hist{display:none;align-items:center;gap:14px;margin:12px 20px 0;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:12px;color:var(--muted)}
  .hist.open{display:flex}
  .hist input[type=range]{flex:1;accent-color:#3b82f6}
  .hist .banner{display:none;align-items:center;gap:10px;background:#3a2b10;border:1px solid #8a6420;color:#fde68a;border-radius:8px;padding:4px 12px;font-size:11.5px;font-weight:600}
  .hist.viewing .banner{display:inline-flex}
  #histBtn.viewing{border-color:#8a6420;color:#fde68a}
  #notebar{margin:10px 20px 0;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #notebar b{color:var(--muted)}

  /* ── 抽屉：480px，标题固定，正文独立滚动，含关系面板 ── */
  #drawer{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:calc(100vw - 32px);background:var(--panel);border-left:1px solid var(--line);z-index:80;transform:translateX(103%);transition:transform .25s;display:flex;flex-direction:column;visibility:hidden}
  #drawer.open{transform:none;visibility:visible}
  #drawer .dhead{padding:16px 20px 10px;border-bottom:1px solid var(--line);position:relative;flex:none}
  #drawer h3{font-size:15px;margin-bottom:2px;padding-right:28px;line-height:1.4}
  #drawer .sub{color:var(--muted);font-size:12px}
  #drawer .close{position:absolute;top:12px;right:12px;border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  #dBody{padding:14px 20px 20px;overflow-y:auto;flex:1}
  #drawer .kv{display:flex;gap:8px;font-size:12px;margin:7px 0}
  #drawer .kv b{color:var(--dim);font-weight:500;flex:0 0 78px}
  #drawer .evbox{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;color:#a5b4fc;margin:10px 0;word-break:break-all}
  #drawer ul{margin:6px 0 0 18px;font-size:12.5px;color:#d1d5db}
  #drawer li{margin:4px 0}
  #drawer .relrow{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted)}
  #drawer .relrow:hover{background:var(--panel2);color:var(--tx)}
  #drawer .relrow .v{flex:none;font-weight:600;font-size:11px}
  #boot{position:fixed;inset:0;background:rgba(10,12,16,.82);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #boot .msg{font-size:15px;color:#c7d2fe}
  #boot .steps{font-size:12px;color:var(--dim)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">◉ 观察台<span class="tag">需求解决地图</span></div>
  <div class="switcher">
    <button id="swBtn">
      <span class="dot empty" id="swDot"></span>
      <span class="sid mono" id="swLabel">—</span>
      <span class="caret">▼</span>
    </button>
    <div class="menu" id="swMenu">
      <div id="swList"></div>
      <div class="swAdd">
        <input id="swNew" class="mono" placeholder="粘贴 session ID（支持前缀）回车添加" spellcheck="false">
        <button id="swAddBtn">添加</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="btnResync">触发同步</button>
    <span id="stat" style="font-size:12px;color:var(--muted)">加载中…</span>
  </div>
  <div class="stamps">
    <div>数据读到 <b class="mono" id="stData">—</b></div>
    <div>摘要更新到 <b class="mono" id="stSum">—</b></div>
  </div>
</div>

<div class="live" id="live">
  <div class="lhead"><span class="pulse"></span>当前进展</div>
  <div class="lbody">
    <div class="lcell"><div class="k">正在做</div><div class="v" id="lvNow">—</div><div class="hint">点击展开全文</div></div>
    <div class="lcell"><div class="k">已证实</div><div class="v" id="lvKnown">—</div><div class="hint">点击展开全文</div></div>
    <div class="lcell"><div class="k" id="lvNextK">下一项验证</div><div class="v" id="lvNext">—</div><div class="hint">点击展开全文</div></div>
  </div>
</div>

<div class="sigbar">
  <span style="letter-spacing:1px;font-size:10.5px;flex:none">参与者 <b id="pcN" style="color:var(--muted)">—</b></span>
  <span id="sigchips" style="display:flex;gap:8px;min-width:0;overflow:hidden"></span>
  <span style="margin-left:auto;flex:none;display:flex;gap:8px;align-items:center">
    <span style="font-size:10.5px" id="pcWork"></span>
    <button id="pcAll" style="padding:4px 12px;font-size:11px">全部参与者</button>
  </span>
  <div id="pcPanel"><input id="pcSearch" placeholder="搜索参与者…" spellcheck="false"><div id="pcList"></div></div>
</div>

<div class="wrap" id="wrap"><svg class="edges" id="edges"></svg></div>
<div id="notebar"></div>
<div style="margin:6px 20px 0"><button id="histBtn" style="padding:5px 14px;font-size:11.5px">⏱ 历史回放</button></div>

<div class="hist" id="hist">
  <span style="white-space:nowrap">时间轴</span>
  <input type="range" id="hslider" min="0" max="0" value="0" step="1">
  <span class="mono" id="hlabel">实时 · 同步 #0</span>
  <span class="banner" id="hbanner">正在查看历史 <button id="hback" style="padding:3px 10px;font-size:11px">回到实时</button></span>
</div>

<aside id="drawer">
  <div class="dhead"><button class="close" id="dClose">✕</button><div id="dHead"></div></div>
  <div id="dBody"></div>
</aside>

<div id="boot"><div class="msg">◉ 正在重建解决地图…</div><div class="steps">解析 JSONL → 拼 agent 树 → LLM 压缩（首次约 1-3 分钟）</div></div>

<script>
/* ═══════ 状态与轮询 ═══════ */
let DATA=null, sessions=[], curSid=null, viewTick=0, follow=true, selAgent=null;
let prevStates=new Map(), prevSyncN=-1, prevSid=null, rgOpen=new Set();
let selectedId=null, drawerId=null, hoveredId=null, expandedZones=new Set();
let pos={}, adj=null, lastW=0, rendering=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function refresh(){
  try{
    const [sr,dr]=await Promise.all([
      fetch('/api/sessions'),
      fetch('/api/data'+(curSid?`?sid=${encodeURIComponent(curSid)}`:'')),
    ]);
    sessions=(await sr.json()).sessions;
    DATA=await dr.json();
  }catch(e){$('stat').textContent='服务未连接';return;}
  if(DATA.error){$('stat').textContent=DATA.error;renderSwitcher();return;}
  const switched=DATA.sessionId!==prevSid;
  if(switched){ // 切换观察者：重置视图态（数据不动，只重置显示）
    viewTick=DATA.syncN;follow=true;selAgent=null;prevStates=new Map();rgOpen=new Set();
    selectedId=null;drawerId=null;hoveredId=null;expandedZones=new Set();closeDrawer();
    prevSid=DATA.sessionId;prevSyncN=-1;
  }
  $('boot').style.display=DATA.syncN===0?'flex':'none';
  $('stat').innerHTML=DATA.analyzing?'<span class="spin"></span>分析中…'
    :(DATA.lastError?`<span style="color:var(--red)">上次同步失败</span>`
    :(DATA.syncN===0?'待首次分析':(viewTick<DATA.syncN?`查看历史 · 最新 #${DATA.syncN}`:`实时 · 同步 #${DATA.syncN}`)));
  if(DATA.syncN>0){render(DATA.syncN!==prevSyncN);$('boot').style.display='none';}
  prevSyncN=DATA.syncN;
  renderSwitcher();
}
setInterval(refresh,5000);

/* ═══════ 切换器 ═══════ */
$('swBtn').onclick=e=>{e.stopPropagation();$('swMenu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('.switcher'))$('swMenu').classList.remove('open');});
function renderSwitcher(){
  const cur=DATA?.sessionId;
  $('swLabel').textContent=cur?cur.slice(0,8)+'…':'—';
  const o=sessions.find(s=>s.sid===cur);
  $('swDot').className='dot '+(o?(o.analyzing?'work':(o.lastError?'err':(o.syncN>0?'done':'empty'))):'empty');
  $('swList').innerHTML=sessions.map(s=>{
    const cls=s.sid===cur?' active':'';
    const st=s.analyzing?'work':(s.lastError?'err':(s.syncN>0?'done':'empty'));
    return `<div class="swrow${cls}" data-sid="${esc(s.sid)}">
      <span class="dot ${st}"></span>
      <span class="sid mono">${esc(s.short)}…</span>
      <span class="meta">#${s.syncN} · ${s.cards}卡 · ${s.children}子agent${s.analyzing?' · 分析中':''}${s.lastError?' · 出错':''}</span>
      <button class="rm" data-rm="${esc(s.sid)}" title="停止观察">✕</button>
    </div>`;
  }).join('')||'<div style="padding:10px;color:var(--dim);font-size:12px">暂无观察者，请在下方添加 session ID</div>';
  $('swList').querySelectorAll('.swrow').forEach(r=>r.onclick=e=>{
    if(e.target.dataset.rm)return;
    curSid=r.dataset.sid;follow=true;$('swMenu').classList.remove('open');refresh();
  });
  $('swList').querySelectorAll('.rm').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();

/* ═══════ 布局引擎：列宽/卡高实测，折叠只改显示 ═══════ */
const visibleAt=(c,t)=>(c.born??0)<=t;
/* 历史取值统一：只取时点以前（含）的最后一条，绝不读未来（B5） */
const atOrBefore=(xs,t)=>(xs||[]).reduce((a,x)=>x.at<=t&&(!a||x.at>=a.at)?x:a,null);
function stateAt(c,t){return atOrBefore(c.states,t)?.s||'unknown';}
const stTxt={doing:'进行中',done:'已证实',failed:'失败',partial:'部分证实',risk:'待确认',resolved:'已解决',unknown:'状态未知'};
const tagColor={goal:'#9fc1f7',subgoal:'#9fc1f7',change:'#b7c0cf',risk:'#fde68a',verify:'#7ee6d8',concl:'#86efac',gap:'#9aa3b2'};
const colIdx=t=>({goal:0,subgoal:1,change:2,risk:2,group:2,verify:3,concl:4,gap:4}[t]??2);
const PAD=24,GAP=28;
function geom(){
  const W=$('wrap').clientWidth-2*PAD;
  const colW=(W-4*GAP)/5;
  return {colW,x:i=>PAD+i*(colW+GAP)};
}
/* 核心事实挑选：未解决问题优先，其次最新结果；无则退回 sub */
const UNRES=/未|失败|缺口|待|风险|阻塞|冲突|仅|无法|错/;
function pickFact(c){
  const fs=(c.facts||[]).filter(f=>f&&String(f).trim());
  if(!fs.length)return c.sub||'';
  let best=-1,bs=-1;
  fs.forEach((f,i)=>{const s=UNRES.test(f)?2:1;if(s>=bs){bs=s;best=i;}});
  return fs[best]||'';
}
function cardPrio(c,st){
  if(st==='failed')return 0;
  if((c.type==='risk'||c.type==='gap')&&st!=='resolved')return 0;
  if(st==='partial')return 0;
  if(st==='risk')return 0;
  if(st==='doing')return 1;
  if(c.type==='verify'||c.type==='concl')return 2;
  if(st==='done'||st==='resolved')return 3;
  return 4;
}
function plan(t){
  const D=DATA;
  const all=[D.goal,...D.cards].filter(c=>visibleAt(c,t));
  const zones=[];
  for(const c of D.cards.filter(x=>x.type==='subgoal'&&visibleAt(x,t))){
    if(c.title&&!zones.includes(c.title))zones.push(c.title);
  }
  const groups={};zones.forEach(z=>groups[z]={mid:[],verify:[],concl:[],sub:null,folded:[]});
  const others=[];
  for(const c of all){
    if(c.id==='GOAL')continue;
    if(c.type==='subgoal'){if(groups[c.title])groups[c.title].sub=c;else others.push(c);continue;}
    if(c.zone&&groups[c.zone]){
      if(['change','risk','group'].includes(c.type))groups[c.zone].mid.push(c);
      else if(c.type==='verify')groups[c.zone].verify.push(c);
      else groups[c.zone].concl.push(c);
    }else others.push(c);
  }
  /* 未匹配归属的卡也必须走同一个折叠器，明示「归属待确认」，不猜归属（B2.1） */
  if(others.length){
    let key='归属待确认';while(zones.includes(key))key+='·';
    zones.push(key);
    groups[key]={sub:null,mid:[],verify:[],concl:[],folded:[]};
    for(const c of others)
      groups[key][['change','risk','group'].includes(c.type)?'mid':c.type==='verify'?'verify':'concl'].push(c);
  }
  /* 每个 zone：概览最多 3 张具体卡 + 1 个折叠入口（P0-2/P0-3） */
  for(const z of zones){
    const g=groups[z];
    const pool=[...g.mid,...g.verify,...g.concl];
    if(pool.length<=3||expandedZones.has(z))continue;
    const scored=pool.map(c=>({c,p:cardPrio(c,stateAt(c,t))}));
    scored.sort((a,b)=>a.p-b.p||(b.c.born??0)-(a.c.born??0));
    const keep=new Set(scored.slice(0,3).map(s=>s.c.id));
    g.folded=pool.filter(c=>!keep.has(c.id));
    g.mid=g.mid.filter(c=>keep.has(c.id));
    g.verify=g.verify.filter(c=>keep.has(c.id));
    g.concl=g.concl.filter(c=>keep.has(c.id));
  }
  return {all,zones,groups};
}
function render(animate){
  if(rendering)return;rendering=true;
  try{renderInner(animate);}finally{rendering=false;}
}
function renderInner(animate){
  const D=DATA;if(!D||!D.syncN)return;
  viewTick=Math.max(0,Math.min(viewTick??D.syncN,D.syncN));
  if(follow)viewTick=D.syncN;
  const t=viewTick;
  const wrap=$('wrap');
  const G=geom();lastW=wrap.clientWidth;
  const {all,zones,groups}=plan(t);
  /* 本轮实际显示集合：只挂载/测量会出现的卡（S2） */
  const shown=[...(D.goal&&visibleAt(D.goal,t)?[D.goal]:[]),
    ...zones.flatMap(z=>[groups[z].sub,...groups[z].mid,...groups[z].verify,...groups[z].concl].filter(Boolean))];
  hoveredId=null;
  /* 邻接表（选中态关系阅读用） */
  adj=new Map();
  for(const e of D.edges){
    if((e.born??0)>t)continue;
    if(!adj.has(e.f))adj.set(e.f,new Set());
    if(!adj.has(e.t))adj.set(e.t,new Set());
    adj.get(e.f).add(e.t);adj.get(e.t).add(e.f);
  }
  wrap.querySelectorAll('.card,.zone,.rgbody,.colhead,.foldentry').forEach(n=>n.remove());
  ['目标 · 验收条件','子目标','方案 · 修改 · 风险','验证 · 证据','已证实 · 缺口'].forEach((s,i)=>{
    const d=document.createElement('div');d.className='colhead';d.style.left=G.x(i)+'px';d.textContent=s;wrap.appendChild(d);
  });
  /* Pass1：先按最终宽度挂载（隐藏）测高，绝不猜高度（P0-4） */
  pos={};
  const mkCard=c=>{
    const d=document.createElement('div');
    d.className='card '+c.type+(stateAt(c,t)==='resolved'?' resolved':'')+(stateAt(c,t)==='failed'?' failed':'')+(stateAt(c,t)==='partial'?' partial':'');
    d.id='c-'+c.id;d.tabIndex=0;d.style.cssText=`left:${G.x(colIdx(c.type))}px;top:0;width:${G.colW}px;visibility:hidden`;
    fillCard(d,c,t);
    wrap.appendChild(d);return d;
  };
  for(const c of shown)mkCard(c);
  const hOf=id=>document.getElementById('c-'+id)?.offsetHeight||60;
  /* Pass2：堆叠 */
  let y=76;const zoneRects=[];
  const stack=(list,colI,startY)=>{let cy=startY;for(const c of list){pos[c.id]={x:G.x(colI),y:cy,w:G.colW,h:hOf(c.id)};cy+=pos[c.id].h+12;}return cy;};
  for(const z of zones){
    const grp=groups[z];const zoneTop=y;
    if(grp.sub){pos[grp.sub.id]={x:G.x(1),y:zoneTop+26,w:G.colW,h:hOf(grp.sub.id)};}
    let mB=stack(grp.mid,2,zoneTop+26), vB=stack(grp.verify,3,zoneTop+26), cB=stack(grp.concl,4,zoneTop+26);
    let sB=grp.sub?pos[grp.sub.id].y+pos[grp.sub.id].h+12:zoneTop+26;
    /* 折叠入口挂在「方案」列底部 */
    if(grp.folded&&grp.folded.length){
      const fe=mkFold(z,grp,t);
      fe.style.cssText+=`left:${G.x(2)}px;top:0;width:${G.colW}px;visibility:hidden`;
      wrap.appendChild(fe);
      const fh=fe.offsetHeight;
      fe.style.top=(mB+2)+'px';fe.style.visibility='';
      mB=mB+fh+12;
    }
    const bottom=Math.max(sB,mB,vB,cB);
    zoneRects.push({z,top:zoneTop,h:Math.max(bottom-zoneTop+8,100)});
    y=zoneTop+Math.max(bottom-zoneTop,96)+30;
  }
  if(D.goal&&visibleAt(D.goal,t)){
    const gh=hOf('GOAL');
    pos.GOAL={x:G.x(0),y:76+Math.max((y-76-gh)/2,0),w:G.colW,h:gh};
  }
  /* 应用最终位置 */
  for(const c of shown){
    const d=$('c-'+c.id),p=pos[c.id];if(!d||!p)continue;
    d.style.top=p.y+'px';d.style.visibility='';
    if(animate&&prevStates.has(c.id)&&prevStates.get(c.id)!==stateAt(c,t))d.classList.add('flash');
    prevStates.set(c.id,stateAt(c,t));
  }
  /* group 过程展开体（rgOpen） */
  for(const c of D.cards.filter(x=>x.type==='group'&&rgOpen.has(x.id)&&pos[x.id]&&visibleAt(x,t))){
    const p=pos[c.id];
    const body=document.createElement('div');body.className='rgbody';
    body.style.cssText=`left:${p.x}px;top:${p.y+p.h+4}px;width:${p.w}px`;
    body.innerHTML=(c.steps||[]).map((s,i)=>`${i?'<div class="rgarrow">▼</div>':''}
      <div class="rgstep"><span class="dot" style="background:${{done:'#34d399',failed:'#f87171',doing:'#60a5fa'}[s.st]||'#60a5fa'}"></span>
      <span>${esc(s.title)}</span><span class="who">${esc(s.who||'')}</span></div>`).join('');
    wrap.appendChild(body);
  }
  /* zone 底色框 + 展开/收起按钮 */
  for(const zr of zoneRects){
    const d=document.createElement('div');d.className='zone';
    d.style.cssText=`left:${G.x(1)-12}px;right:12px;top:${zr.top}px;height:${zr.h}px`;
    const expandable=expandedZones.has(zr.z);
    d.innerHTML=`<span class="zh">${groups[zr.z]&&groups[zr.z].sub?`子目标 · ${esc(zr.z)}`:esc(zr.z)}${expandable?` <button data-xz="${esc(zr.z)}">收起 ↑</button>`:''}</span>`;
    wrap.appendChild(d);
  }
  wrap.querySelectorAll('[data-xz]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();expandedZones.delete(b.dataset.xz);render(false);
  });
  wrap.style.height=(y+34)+'px';
  drawEdges(t);
  applyEmphasis();
  renderSig(t);renderLive(t);renderHist(t);renderNote();
  if(drawerId){const c=all.find(q=>q.id===drawerId);c?renderDrawer(c):closeDrawer();}
}
function fillCard(d,c,t){
  const st=stateAt(c,t);
  const ctag=c.id==='GOAL'?'目标':({subgoal:'子目标',change:'方案',risk:'风险',verify:'验证',concl:'结论',gap:'缺口',group:'过程'}[c.type]||c.type);
  const sigs=c.sig||[];
  const sig1=sigs.length?`${esc(sigs[0].verb)} · <b>${esc(sigs[0].agent)}</b>`:'';
  const more=sigs.length>1?`<span class="more">另 ${sigs.length-1} 人</span>`:'';
  const nD=(c.facts||[]).length||(c.steps||[]).length;
  const fact=pickFact(c);
  let html=`<div class="meta"><span class="ctag" style="color:${tagColor[c.type]}">${ctag}</span>${stTxt[st]?`<span class="stbadge st-${st}">${stTxt[st]}</span>`:''}</div>`;
  html+=`<h4 class="clamp2">${esc(c.title)}</h4>`;
  if(c.id==='GOAL'&&c.acc&&c.acc.length){
    html+=`<ul class="acc">${c.acc.slice(0,3).map(a=>`<li class="clamp2">${esc(a)}</li>`).join('')}${c.acc.length>3?`<li style="color:var(--dim);list-style:none;margin-left:-14px;font-size:10.5px">等 ${c.acc.length} 条验收条件</li>`:''}</ul>`;
  }else if(fact){
    html+=`<div class="fact clamp2" title="${esc(fact)}">${esc(fact)}</div>`;
  }else if(c.type==='group'){
    html+=`<div class="fact">${(c.steps||[]).length} 步过程</div>`;
  }
  html+=`<div class="foot"><span class="sig1">${sig1}</span>${more}<button class="dtl">详情${nD?` · ${nD} 条`:''}</button></div>`;
  d.innerHTML=html;
  if(sigs.length>1)d.querySelector('.more').title=sigs.map(g=>`${g.verb}:${g.agent}`).join('；');
  d.onclick=e=>{
    if(e.target.closest('.dtl')){openDrawer(c);e.stopPropagation();return;}
    if(c.type==='group'&&e.target.closest('.fact')&&(c.steps||[]).length){rgOpen.has(c.id)?rgOpen.delete(c.id):rgOpen.add(c.id);render(false);e.stopPropagation();return;}
    if(selectedId===c.id){openDrawer(c);}
    else{selectedId=c.id;applyEmphasis();}
    e.stopPropagation();
  };
  d.onmouseenter=()=>{hoveredId=c.id;applyEmphasis();};
  d.onmouseleave=()=>{if(hoveredId===c.id){hoveredId=null;applyEmphasis();}};
  d.onkeydown=e=>{
    if(e.target!==d)return;
    if(e.key==='Enter'){e.preventDefault();if(selectedId===c.id)openDrawer(c);else{selectedId=c.id;applyEmphasis();}}
  };
}
function mkFold(z,grp,t){
  const d=document.createElement('button');d.type='button';d.className='foldentry';
  const n=grp.folded.length;
  const uns=grp.folded.filter(c=>cardPrio(c,stateAt(c,t))===0).length;
  let relN=0;const D=DATA;
  const hid=new Set(grp.folded.map(c=>c.id));
  for(const e of D.edges){if((e.born??0)>t)continue;if(hid.has(e.f)||hid.has(e.t))relN++;}
  d.innerHTML=`<span class="t1">其余 <b>${n}</b> 项记录${uns?` · <span class="uns">${uns} 项未解决</span>`:''}</span>
    <span class="t2">含 ${relN} 条关系 · 全文在详情中可查</span>
    <span class="go">展开本分支 →</span>`;
  d.onclick=e=>{e.stopPropagation();expandedZones.add(z);selectedId=null;render(false);};
  return d;
}

/* ═══════ 边：三级显示，默认只给未解决障碍上标签（P0-5） ═══════ */
function drawEdges(t){
  const esvg=$('edges');esvg.innerHTML='';
  const D=DATA;const cards=[D.goal,...D.cards];
  esvg.setAttribute('width',$('wrap').clientWidth);esvg.setAttribute('height',$('wrap').style.height);
  const anchor=(c,side)=>{const p=pos[c.id];if(!p)return null;
    const m={l:[p.x,p.y+p.h/2],r:[p.x+p.w,p.y+p.h/2],t:[p.x+p.w/2,p.y],b:[p.x+p.w/2,p.y+p.h]};return m[side];};
  const verbColor={拆成:'#5f6b7e',采用:'#5f6b7e',检查:'#5f6b7e',妨碍:'#fbbf24',解决:'#34d399',支持:'#2dd4bf','留下缺口':'#6b7280'};
  let mainLabels=0;
  for(const e of D.edges){
    if((e.born??0)>t)continue;
    if(!pos[e.f]||!pos[e.t])continue; // 折叠隐藏的卡不画线，关系数在折叠入口里如实说明
    const f=cards.find(c=>c.id===e.f),tt=cards.find(c=>c.id===e.t);
    if(!f||!tt)continue;
    const hor=colIdx(f.type)!==colIdx(tt.type);
    let fa,ta;
    if(hor){fa=pos[e.f].x<pos[e.t].x?'r':'l';ta=pos[e.t].x<pos[e.f].x?'l':'r';}
    else{fa=pos[e.f].y<pos[e.t].y?'b':'t';ta=pos[e.t].y<pos[e.f].y?'t':'b';}
    const a=anchor(f,fa),b2=anchor(tt,ta);if(!a||!b2)continue;
    const c1=hor?[a[0]+(b2[0]>a[0]?40:-40),a[1]]:[a[0],a[1]+(b2[1]>a[1]?40:-40)];
    const c2=hor?[b2[0]-(b2[0]>a[0]?40:-40),b2[1]]:[b2[0],b2[1]-(b2[1]>a[1]?40:-40)];
    const kind=(e.v==='妨碍'||e.v==='留下缺口')?'risk':((e.v==='解决'||e.v==='支持')?'solve':'flow');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${a[0]} ${a[1]} C ${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${b2[0]} ${b2[1]}`);
    p.setAttribute('fill','none');
    p.dataset.f=e.f;p.dataset.t=e.t;
    /* 默认等级建边时算一次：未解决障碍才是主线，已解决风险降回背景（B3） */
    const obstacle=e.v==='妨碍'?f:e.v==='留下缺口'?tt:null;
    const main=!!obstacle&&!['done','resolved'].includes(stateAt(obstacle,t));
    p.classList.add(main?'main':'ctx');
    p.setAttribute('stroke',verbColor[e.v]||'#5f6b7e');
    p.setAttribute('stroke-width',kind==='risk'?'1.7':'1.2');
    if(kind==='risk')p.setAttribute('stroke-dasharray','5 4');
    esvg.appendChild(p);
    /* 标签纪律：每条边都有 text 节点；默认只放行未解决障碍（前 6 条），其余选中/hover 才显示 */
    const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('x',(a[0]+b2[0])/2+(hor?0:16));tx.setAttribute('y',(a[1]+b2[1])/2+(hor?-8:0));
    tx.setAttribute('text-anchor','middle');tx.setAttribute('fill',verbColor[e.v]||'#5f6b7e');
    tx.textContent=e.v;tx.dataset.f=e.f;tx.dataset.t=e.t;
    if(main&&mainLabels<6)tx.classList.add('show0');
    esvg.appendChild(tx);
    if(main&&mainLabels<6)mainLabels++;
  }
}
/* 选中 / hover / 署名筛选：单趟 toggle，边只认选中卡本人的直接关系（B3） */
function applyEmphasis(){
  const esvg=$('edges');
  const focusId=hoveredId||selectedId;
  const focusing=!!(focusId||selAgent);
  let hlIds=new Set();
  if(focusId){hlIds.add(focusId);(adj?.get(focusId)||[]).forEach(x=>hlIds.add(x));}
  else if(selAgent){
    for(const c of [DATA.goal,...DATA.cards])if((c.sig||[]).some(g=>g.agent===selAgent))hlIds.add(c.id);
  }
  const edgeHit=p=>focusId
    ? p.dataset.f===focusId||p.dataset.t===focusId
    : hlIds.has(p.dataset.f)||hlIds.has(p.dataset.t);
  document.querySelectorAll('#wrap .card').forEach(n=>{
    const id=n.id.slice(2);
    n.classList.toggle('hl',focusing&&hlIds.has(id));
    n.classList.toggle('sel',selectedId===id);
  });
  esvg.querySelectorAll('path,text').forEach(p=>{
    const hit=focusing&&edgeHit(p);
    p.classList.toggle('hl',hit);
    if(p.tagName==='text')p.classList.toggle('show',focusing?hit:p.classList.contains('show0'));
  });
  $('wrap').classList.toggle('focusmode',focusing);
}

/* ═══════ 参与者：摘要 + 面板（P0-6） ═══════ */
function renderSig(t){
  const D=DATA;const m=new Map();
  for(const c of [D.goal,...D.cards])if(visibleAt(c,t))for(const g of c.sig||[]){
    if(!m.has(g.agent))m.set(g.agent,{count:0,color:(D.agents.find(a=>a.key===g.agent)||{}).color||'#98a1b0'});
    m.get(g.agent).count++;
  }
  const entries=[...m.entries()].sort((a,b)=>b[1].count-a[1].count);
  const working=entries.filter(([k])=>{
    return [DATA.goal,...DATA.cards].some(c=>visibleAt(c,t)&&(c.sig||[]).some(g=>g.agent===k)&&stateAt(c,t)==='doing');
  }).length;
  $('pcN').textContent=entries.length||'0';
  $('pcWork').textContent=working?`工作中 ${working}`:'';
  $('sigchips').innerHTML=entries.slice(0,3).map(([k,v])=>
    `<span class="sigchip${selAgent===k?' on':''}" data-k="${esc(k)}"><span class="cdot" style="background:${v.color}"></span>${esc(k)}<span class="n">${v.count}</span></span>`).join('');
  $('sigchips').querySelectorAll('.sigchip').forEach(ch=>ch.onclick=e=>{e.stopPropagation();toggleAgent(ch.dataset.k);});
  renderPcPanel(entries);
}
/* chip 与面板两个入口统一反馈（S4） */
function toggleAgent(key){selAgent=selAgent===key?null:key;applyEmphasis();renderSig(viewTick);}
function renderPcPanel(entries){
  const list=()=>entries.filter(([k])=>!$('pcSearch').value||k.toLowerCase().includes($('pcSearch').value.toLowerCase()));
  const draw=()=>{
    $('pcList').innerHTML=list().map(([k,v])=>
      `<div class="pcrow${selAgent===k?' on':''}" data-k="${esc(k)}"><span class="cdot dot" style="background:${v.color}"></span>${esc(k)}<span class="n">${v.count} 卡</span></div>`).join('')
      ||'<div style="padding:8px;color:var(--dim);font-size:12px">无匹配</div>';
    $('pcList').querySelectorAll('.pcrow').forEach(r=>r.onclick=()=>{
      toggleAgent(r.dataset.k);$('pcPanel').classList.remove('open');
    });
  };
  $('pcAll').onclick=e=>{e.stopPropagation();$('pcPanel').classList.toggle('open');draw();};
  $('pcSearch').oninput=draw;
}

/* ═══════ 当前进展 / 历史 / 备注 ═══════ */
function renderLive(t){
  const D=DATA;const e=atOrBefore(D.live,t)||{};
  $('lvNow').textContent=e.now||'—';
  $('lvKnown').textContent=e.known||'—';
  $('lvNextK').textContent=e.nextK||'下一项验证';
  $('lvNext').textContent=e.next||'—';
  const st=atOrBefore(D.stamps,t)||{};
  $('stData').textContent=st.data||'—';$('stSum').textContent=st.summary||'—';
}
function renderHist(t){
  const D=DATA;const hs=$('hslider');hs.max=D.syncN;hs.value=t;
  $('hlabel').textContent=t<D.syncN?`历史 · 同步 #${t}`:`实时 · 同步 #${D.syncN}`;
  $('hist').classList.toggle('viewing',t<D.syncN);
  $('histBtn').classList.toggle('viewing',t<D.syncN);
}
function renderNote(){
  const D=DATA;
  const kids=D.children||[];
  const byKind={};let nofile=0;
  for(const c of kids){byKind[c.kind]=(byKind[c.kind]||0)+1;if(c.matched==='no-file')nofile++;}
  const kinds=Object.entries(byKind).map(([k,n])=>`${k}×${n}`).join(' · ');
  $('notebar').innerHTML=`${D.note?`<b>备注</b> ${esc(D.note)} · `:''}<b>子会话</b> ${kids.length}（${esc(kinds)||'—'}${nofile?`，未定位文件 ${nofile}`:''}）${D.lastError?` · <span style="color:var(--red)">错误: ${esc(D.lastError)}</span>`:''}`;
}

/* ═══════ 抽屉：全文 + 关系面板（P0-1 / P1-1） ═══════ */
function openDrawer(c){
  drawerId=c.id;if(selectedId!==c.id)selectedId=c.id;
  renderDrawer(c);
  $('drawer').classList.add('open');
  $('dClose').focus();
  applyEmphasis();
}
function renderDrawer(c){
  const t=viewTick,st=stateAt(c,t),st0=$('dBody').scrollTop;
  $('dHead').innerHTML=`<h3>${esc(c.title)}</h3><div class="sub">${esc(c.zone||'')} · ${esc(c.type)} · 状态：${stTxt[st]||st}</div>`;
  const cards=[DATA.goal,...DATA.cards];
  const rels=[];
  for(const e of DATA.edges){
    if((e.born??0)>t)continue;
    if(e.f===c.id)rels.push({dir:'→',v:e.v,other:e.t});
    else if(e.t===c.id)rels.push({dir:'←',v:e.v,other:e.f});
  }
  const nameOf=id=>{const x=cards.find(q=>q.id===id);return x?x.title:id;};
  $('dBody').innerHTML=`
    ${(c.sig&&c.sig.length)?`<div class="kv"><b>署名</b><span>${c.sig.map(g=>`${esc(g.verb)}：${esc(g.agent)}`).join('；')}</span></div>`:''}
    ${rels.length?`<div class="kv" style="margin-top:12px"><b>关系（${rels.length}）</b></div><div style="margin-top:4px">${rels.map((r,i)=>`<div class="relrow" data-i="${i}"><span class="v" style="color:${r.dir==='→'?'#7ea6d9':'#a78bfa'}">${r.dir} ${esc(r.v)}</span><span>${esc(nameOf(r.other))}</span></div>`).join('')}</div>`:''}
    <div class="kv" style="margin-top:12px"><b>关键事实${(c.facts||[]).length?`（${c.facts.length}）`:''}</b></div>
    <ul>${(c.facts||[]).map(f=>`<li>${esc(f)}</li>`).join('')||'<li>—</li>'}</ul>
    ${(c.steps&&c.steps.length)?`<div class="kv" style="margin-top:12px"><b>过程（${c.steps.length}）</b></div><ul>${c.steps.map(s=>`<li>${esc(s.title)}（${esc(s.who||'')}·${esc(s.st||'')}）</li>`).join('')}</ul>`:''}
    ${c.acc?`<div class="kv" style="margin-top:12px"><b>验收条件</b></div><ul>${c.acc.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
    <div class="evbox mono">${esc(c.ev||'—')}</div>`;
  $('dBody').querySelectorAll('.relrow').forEach(r=>r.onclick=()=>{
    const target=rels[+r.dataset.i].other;
    const tc=cards.find(q=>q.id===target);
    if(tc){selectedId=target;openDrawer(tc);render(false);}
  });
  $('dBody').scrollTop=st0;
}
function closeDrawer(){
  $('drawer').classList.remove('open');
  const back=drawerId;drawerId=null;
  if(back){const n=$('c-'+back);if(n)n.focus();}
  applyEmphasis();
}
/* 键盘阅读路径：Esc 关抽屉→清选中；Enter 选中→开抽屉（P1-1） */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('drawer').classList.contains('open'))closeDrawer();
    else if($('pcPanel').classList.contains('open'))$('pcPanel').classList.remove('open');
    else if(selectedId){selectedId=null;applyEmphasis();}
  }
});
/* 宽度变化 → 实测重排（P0-4） */
new ResizeObserver(()=>{
  const w=$('wrap').clientWidth;
  if(w&&Math.abs(w-lastW)>2&&DATA&&DATA.syncN>0)render(false);
}).observe($('wrap'));
</script>
