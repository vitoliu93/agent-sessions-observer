<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session 观察台 · 需求解决地图</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1c212c; --line:#282e3b;
    --tx:#e7eaf0; --muted:#98a1b0; --dim:#8993a3;
    --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --red:#f87171; --teal:#2dd4bf; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Segoe UI",sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:60}
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand .tag{font-size:10px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  /* 会话切换器 */
  .switcher{position:relative}
  #swBtn{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:space-between}
  #swBtn .sid{font-size:12px}
  #swBtn .caret{color:var(--dim);font-size:10px}
  .menu{position:absolute;top:calc(100% + 8px);left:0;width:380px;max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:8px;display:none;z-index:70}
  .menu.open{display:block}
  .swrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .swrow:hover{background:var(--panel2)}
  .swrow.active{border-color:#3b5bdb66;background:#141b2c}
  .swrow .sid{font-size:12.5px;font-weight:600;min-width:0;text-align:left;display:flex;flex-direction:column}
  .swrow .ttl,#swLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}.swrow .sid .mono{font-size:11px;font-weight:400;color:var(--dim)}
  .swrow .meta{font-size:10.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .swrow .rm{border:none;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:5px;opacity:0}
  .swrow:hover .rm{opacity:1}
  .swrow .rm:hover{color:var(--red);background:#2a1a1a}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.done{background:var(--green)} .dot.err{background:var(--red)}
  .dot.work{background:var(--blue);animation:blink 1.1s infinite} .dot.empty{background:#475569}
  @keyframes blink{50%{opacity:.25}}
  .swAdd{display:flex;gap:8px;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
  .swAdd input{flex:1;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px}
  .swAdd button{padding:6px 14px;font-size:12px}
  .controls{display:flex;align-items:center;gap:10px;flex:1}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--blue);color:#fff}
  button.primary{background:#2563eb;border-color:#2563eb;font-weight:600}
  .stamps{margin-left:auto;text-align:right;font-size:11px;color:var(--dim);line-height:1.5;white-space:nowrap}
  .stamps b{color:var(--muted)}

  /* 当前进展只做摘要，全文在侧栏 */
  .live{display:grid;grid-template-columns:110px 1fr 1fr 1fr;margin:12px 20px 0;border:1px solid #2b3a55;border-radius:12px;background:#141b2a}
  .live .lhead{display:flex;align-items:center;justify-content:center;font-weight:700;color:#9fc1f7}
  .live .lbody{display:contents}
  .live .lcell{padding:10px 14px;border:0;border-left:1px solid #223049;border-radius:0;background:none;text-align:left;min-width:0}
  .live .k{font-size:12px;color:var(--dim);margin-bottom:3px}
  .live .v{font-size:13px;color:#dbe3ef;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
  .live .hint{font-size:11px;color:var(--dim);margin-top:3px}

  /* ── 参与者：摘要一行 + 面板，不铺满横带 ── */
  .sigbar{position:relative;display:flex;align-items:center;gap:10px;margin:10px 20px 0;font-size:12px;color:var(--dim)}
  .sigchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--muted)}
  .sigchip.on{border-color:var(--violet);color:#fff;background:#221d38}
  .sigchip .n{font-size:10px;color:var(--dim)}
  #pcPanel{position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:60vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:10px;display:none;z-index:70}
  #pcPanel.open{display:block}
  #pcPanel input{width:100%;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:8px}
  #pcList{display:flex;flex-direction:column;gap:4px}
  .pcrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted)}
  .pcrow:hover{background:var(--panel2)} .pcrow.on{background:#221d38;color:#fff}
  .pcrow .n{margin-left:auto;font-size:10px;color:var(--dim)}

  /* ── 地图画布：列宽实测，卡片高度实测 ── */
  .wrap{position:relative;overflow-x:auto;margin:14px 20px 0;border:1px solid var(--line);border-radius:14px;background:radial-gradient(1000px 500px at 22% 0%,#151b28 0%,var(--bg) 65%)}
  .colhead{position:absolute;top:14px;font-size:11px;color:var(--dim);letter-spacing:2px;z-index:1}
  svg.edges{position:absolute;inset:0;z-index:1;pointer-events:none}#room{position:absolute;top:0;width:1px;height:1px}
  svg.edges text{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#0e1014;stroke-width:4px;display:none}
  svg.edges text.show{display:inline}
  svg.edges path.ctx{opacity:.45}svg.edges path.main{opacity:.65}svg.edges path.hl{opacity:1}
  svg.edges path{transition:opacity .2s,stroke .2s}

  /* ── 卡片：四层结构，高度自适应，只有标题/摘要有意省略 ── */
  .card{min-width:0;position:absolute;z-index:2;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;display:grid;gap:4px}
  .card:hover{border-color:#465170}
  .card.sel{outline:2px solid var(--blue);outline-offset:2px}
  .clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
  .card .meta{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
  .card .ctag{font-size:9.5px;letter-spacing:1px;padding:1px 7px;border-radius:4px;font-weight:700;background:#232a38;flex:none}
  .card .stbadge{font-size:9.5px;padding:1px 8px;border-radius:99px;font-weight:700;flex:none}
  .card h4{font-size:14px;font-weight:650;line-height:20px}
  .card .fact{font-size:13px;color:var(--muted);line-height:18px}
  .card ul.acc{margin:2px 0 0 16px;font-size:11.5px;color:#c3cbd8}
  .card .foot{display:flex;align-items:center;gap:8px;min-width:0;min-height:20px}
  .card .sig1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--dim)}
  .card .sig1 b{color:var(--muted);font-weight:600}
  .card .more{font-size:10px;color:var(--dim);flex:none}
  .card .dtl{margin-left:auto;flex:none;border:none;background:none;color:var(--teal);font-size:10.5px;cursor:pointer;padding:2px 6px;border-radius:6px}
  .card .dtl:hover{background:#0f2725;color:#8ef0e2}
  .card .st-doing{background:#1e3a5c;color:#93c5fd}
  .card .st-done,.card .st-resolved{background:#14532d;color:#86efac}
  .card .st-failed{background:#5c1d1d;color:#fca5a5}
  .card .st-partial,.card .st-risk{background:#574308;color:#fde68a}
  .card.goal{background:linear-gradient(160deg,#17233c,#131a2a);border-color:#3b5bdb88}
  .card.subgoal{border-color:#2c4a7c}
  .card.risk{border-color:#8a6420;background:#1d1a10}
  .card.risk.resolved{border-color:#2f5c48;background:#111b16}
  .card.verify{border-color:#1f4f4a}
  .card.verify.failed{border-color:#7c3333;background:#1d1212}
  .card.concl{background:linear-gradient(160deg,#122019,#101613)}
  .card.concl.partial{background:linear-gradient(160deg,#211f10,#16140d)}
  .card.gap{border-style:dashed;border-color:#3a4459;background:#12141a}

  /* ── 折叠入口：虚线 UI 容器，不是业务节点 ── */
  .foldentry{position:absolute;z-index:2;border:1.5px dashed #33405a;border-radius:11px;background:rgba(22,26,34,.55);padding:10px 12px;cursor:pointer;color:var(--muted);text-align:left;font:inherit}
  .foldentry>span{display:block}
  .foldentry:hover{border-color:#4a5b7d;background:#161c28}
  .foldentry.hl{border-color:var(--blue);background:#192338}
  .foldentry .t1{font-size:12px;font-weight:600;color:#aab6c8}
  .foldentry .t2{font-size:10.5px;color:var(--dim);margin-top:3px}.foldentry .uns{color:var(--amber)}
  .foldentry .go{margin-top:5px;font-size:10.5px;color:var(--teal)}

  /* 选择时保留正文对比度，仅弱化无关边与卡片背景。 */
  .focusmode .card:not(.hl){border-color:#303745;background:#12151c}
  .focusmode svg.edges path[data-edge]:not(.hl){opacity:.05}
  .focusmode svg.edges text:not(.hl){opacity:0}

  /* ── 历史：默认收起 ── */
  .hist{display:none;align-items:center;gap:14px;margin:12px 20px 0;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:12px;color:var(--muted)}
  .hist.open{display:flex}
  .hist input[type=range]{flex:1;accent-color:#3b82f6}
  .hist .banner{display:none;align-items:center;gap:10px;background:#3a2b10;border:1px solid #8a6420;color:#fde68a;border-radius:8px;padding:4px 12px;font-size:11.5px;font-weight:600}
  .hist.viewing .banner{display:inline-flex}
  #histBtn.viewing{border-color:#8a6420;color:#fde68a}
  #notebar{margin:10px 20px 0;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── 抽屉：480px，标题固定，正文独立滚动，含关系面板 ── */
  #drawer{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:calc(100vw - 32px);background:var(--panel);border-left:1px solid var(--line);z-index:80;transform:translateX(103%);transition:transform .25s;display:flex;flex-direction:column;visibility:hidden}
  #drawer.open{transform:none;visibility:visible}
  #drawer .dhead{padding:16px 20px 10px;border-bottom:1px solid var(--line);position:relative;flex:none}
  #drawer h3{font-size:15px;margin-bottom:2px;padding-right:28px;line-height:1.4}
  #drawer .sub{color:var(--muted);font-size:12px}
  #drawer .close{position:absolute;top:12px;right:12px;border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  #dBody{padding:14px 20px 20px;overflow-y:auto;flex:1}
  #drawer .kv{display:flex;gap:8px;font-size:12px;margin:7px 0}
  #drawer .kv b{color:var(--dim);font-weight:500;flex:0 0 78px}
  #drawer .evbox{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;color:#a5b4fc;margin:10px 0;word-break:break-all}
  #drawer ul{margin:6px 0 0 18px;font-size:12.5px;color:#d1d5db}
  #drawer li{margin:4px 0}
  #drawer .relrow{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted)}
  #drawer .relrow:hover{background:var(--panel2);color:var(--tx)}
  #boot .msg{font-size:15px;color:#c7d2fe}
  #boot .steps{font-size:12px;color:var(--dim)}
  .toolbar{display:flex;align-items:center;gap:10px;margin:12px 20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  select,input{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0}
  .toolbar select{max-width:440px}.toolbar button{font-size:12px;padding:5px 10px}
  #notice{color:var(--amber)}#pending{color:var(--teal)}[hidden]{display:none!important}
  .pcrow,.sigchip,.relrow{font:inherit;text-align:left}.pcrow,.relrow{width:100%;background:none;border:0}
  .pcrow{overflow-wrap:anywhere}.pcrow .n{flex:none}
  .sigchip{font-size:12px}.sigchip .label{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card:focus-visible,.foldentry:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .card .branch{font-size:11px;padding:2px 5px;background:none;color:var(--teal)}
  .card .ctag,.card .stbadge{font-size:11px;letter-spacing:0}
  #drawer{overflow-wrap:anywhere}#dBody{min-height:0}#drawer .kv>span{min-width:0}#drawer .sub{overflow-wrap:anywhere}
  .colhead{display:flex;gap:8px;align-items:center;letter-spacing:0}.colhead button{padding:2px 6px;font-size:11px}
  #boot{position:static;background:var(--panel);backdrop-filter:none;border:1px solid var(--line);border-radius:12px;margin:12px 20px;padding:24px;text-align:center;display:none}
  #notebar{white-space:normal;overflow-wrap:anywhere}
  .foldentry{overflow-wrap:anywhere}.foldentry .t2{font-size:11px}.swrow:focus-within .rm{opacity:1}
  @media(max-width:900px){.brand .tag{display:none}.live{grid-template-columns:1fr}.live .lhead{padding:8px}.live .lcell{border-top:1px solid #223049}.stamps{margin-left:0}.sigbar{flex-wrap:wrap}.toolbar select{max-width:100%}#sigchips{flex-wrap:wrap}.menu{width:min(380px,90vw)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">◉ 观察台<span class="tag">需求解决地图</span></div>
  <div class="switcher">
    <button id="swBtn">
      <span class="dot empty" id="swDot"></span>
      <span class="sid mono" id="swLabel">—</span>
      <span class="caret">▼</span>
    </button>
    <div class="menu" id="swMenu">
      <div id="swList"></div>
      <div class="swAdd">
        <input id="swNew" class="mono" placeholder="粘贴 session ID（支持前缀）回车添加" spellcheck="false">
        <button id="swAddBtn">添加</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="btnResync">触发同步</button>
    <span id="stat" style="font-size:12px;color:var(--muted)">加载中…</span>
  </div>
  <div class="stamps">
    <div>数据读到 <b class="mono" id="stData">—</b></div>
    <div>摘要更新到 <b class="mono" id="stSum">—</b></div>
  </div>
</div>

<div class="live" id="live">
  <div class="lhead">当前进展</div>
  <div class="lbody">
    <button class="lcell" type="button"><div class="k">正在做</div><div class="v" id="lvNow">—</div><div class="hint">查看进展全文 →</div></button>
    <button class="lcell" type="button"><div class="k">已证实</div><div class="v" id="lvKnown">—</div><div class="hint">查看进展全文 →</div></button>
    <button class="lcell" type="button"><div class="k" id="lvNextK">下一项验证</div><div class="v" id="lvNext">—</div><div class="hint">查看进展全文 →</div></button>
  </div>
</div>

<div class="sigbar">
  <span style="letter-spacing:1px;font-size:10.5px;flex:none">参与者 <b id="pcN" style="color:var(--muted)">—</b></span>
  <span id="sigchips" style="display:flex;gap:8px;min-width:0;overflow:hidden"></span>
  <span style="margin-left:auto;flex:none;display:flex;gap:8px;align-items:center">
    <span style="font-size:10.5px" id="pcWork"></span>
    <button id="pcAll" style="padding:4px 12px;font-size:11px">全部参与者</button>
  </span>
  <div id="pcPanel"><input id="pcSearch" placeholder="搜索参与者…" spellcheck="false"><div id="pcList"></div></div>
</div>

<div class="toolbar"><label>查看 <select id="branch"><option value="">全局概览</option></select></label><span id="scope"></span><button id="reset">重置视图</button><button id="pending" hidden></button><span id="notice" role="status" aria-live="polite"></span></div>
<div class="wrap" id="wrap"><svg class="edges" id="edges"></svg></div>
<div id="notebar"></div>
<div style="margin:6px 20px 0"><button id="histBtn" style="padding:5px 14px;font-size:11.5px">⏱ 历史回放</button></div>

<div class="hist" id="hist">
  <span style="white-space:nowrap">时间轴</span>
  <span class="banner" id="hbanner">正在查看历史 <button id="hback" style="padding:3px 10px;font-size:11px">回到实时</button></span>
  <input type="range" id="hslider" min="0" max="0" value="0" step="1">
  <span class="mono" id="hlabel">实时 · 同步 #0</span>
</div>

<aside id="drawer" aria-label="详情" tabindex="-1">
  <div class="dhead"><button class="close" id="dClose" aria-label="关闭详情">✕</button><div id="dHead"></div></div>
  <div id="dBody"></div>
</aside>

<div id="boot" role="status"><div class="msg">正在读取会话…</div><div class="steps">可从左上角添加或切换会话。</div></div>

<script>
/* 记录数据与当前阅读快照分开；历史、抽屉、地图始终读同一个 VIEW。 */
let DATA=null,VIEW=null,sessions=[],curSid=null,viewTick=0,follow=true;
let selectedId=null,drawerId=null,hoveredId=null,selAgent=null,branchId='',expandedZones=new Set();
let pos=Object.create(null),byId=new Map(),cardGroup=new Map(),edgeViews=[];
let requestN=0,lastKey='',pending=null,lastW=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cards=()=>VIEW?[VIEW.goal,...VIEW.cards].filter(Boolean):[];
const atOrBefore=(xs,t)=>(xs||[]).reduce((a,x)=>x.at<=t&&(!a||x.at>=a.at)?x:a,null);
const stateAt=(c,t=viewTick)=>atOrBefore(c.states,t)?.s||c.st||'unknown';
const typeOf=c=>c.id==='GOAL'?'goal':c.type;
const types={goal:'目标',subgoal:'子目标',change:'修改',risk:'风险',
  verify:'验证',concl:'结论',gap:'缺口',group:'修复过程'};
const colors={goal:'#9fc1f7',subgoal:'#9fc1f7',change:'#b7c0cf',risk:'#fde68a',
  verify:'#7ee6d8',concl:'#86efac',gap:'#9aa3b2',group:'#b7c0cf'};
const labels={doing:'进行中',done:'已完成',failed:'失败',partial:'部分证实',
  risk:'待确认',resolved:'已解决',unknown:'状态未知'};
const colIdx=c=>({goal:0,subgoal:1,change:2,risk:2,group:2,verify:3,concl:4,gap:4}[typeOf(c)]??2);
const isOpen=c=>['risk','gap'].includes(typeOf(c))&&!['done','resolved'].includes(stateAt(c));
const priority=c=>isOpen(c)?0:stateAt(c)==='failed'?1:stateAt(c)==='doing'?2:['verify','concl'].includes(typeOf(c))?3:4;
function tell(message){$('notice').textContent=message;}
async function json(url,body){
  const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||d.error)throw new Error(d.error||`请求失败 (${r.status})`);
  return d;
}
function resetView(){
  selectedId=hoveredId=selAgent=null;branchId='';
  expandedZones.clear();closeDrawer(false);
}
function snapshot(d,t){
  const saved=atOrBefore(d.history,t);
  if(saved)return {...d,...saved,syncN:d.syncN,history:d.history};
  return {...d,goal:d.goal?{...d.goal,type:'goal',...(d.goal.type?{}:{states:[],st:'unknown'})}:null};
}
function clearMap(message){
  DATA=VIEW=null;lastKey='';pending=null;edgeViews=[];
  resetView();
  $('edges').innerHTML='';$('wrap').replaceChildren($('edges'));$('wrap').style.height='0px';
  for(const id of ['lvNow','lvKnown','lvNext','stData','stSum'])$(id).textContent='—';
  $('sigchips').replaceChildren();
  $('scope').textContent='';$('pcN').textContent='0';$('pcWork').textContent='';$('notebar').textContent='';
  $('branch').innerHTML='<option value="">全局概览</option>';

function owners(){
  const sub=cards().filter(c=>c.type==='subgoal'), result=new Map();
  for(const c of cards()){
    const exact=sub.find(s=>s.id===(c.goalId||c.zoneId||c.zone))||
      sub.find(s=>s.title===c.zone&&sub.filter(x=>x.title===c.zone).length===1);
    if(exact)result.set(c.id,new Set([exact.id]));
    if(c.type==='subgoal')result.set(c.id,new Set([c.id]));
  }
  for(let i=0;i<cards().length;i++){
    let changed=false;
    for(const e of VIEW.edges||[]){
      if(!['采用','检查','支持','留下缺口','解决','妨碍'].includes(e.v))continue;
      const f=e.v==='妨碍'?e.t:e.f,t=e.v==='妨碍'?e.f:e.t;
      const from=result.get(f);
      if(!from)continue;
      const set=result.get(t)||new Set();

  }

}

    let shown=expandedZones.has(String(i))?ordered:ordered.slice(0,i===0?1:3);

/* 所有跨列线经列间空隙和卡片上方走，不穿过第三方卡片。折叠映射只代表集合。 */
function drawEdges(){
  const svg=$('edges'),NS='http://www.w3.org/2000/svg';
  svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"'+
    ' markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>';
  svg.setAttribute('width',Math.max($('wrap').clientWidth,960));
  svg.setAttribute('height',$('wrap').clientHeight);
  edgeViews=[];
  const grouped=new Map();
  for(const e of VIEW.edges||[]){
    if(!byId.has(e.f)||!byId.has(e.t))continue;
    const f=pos[e.f]?e.f:cardGroup.get(e.f),t=pos[e.t]?e.t:cardGroup.get(e.t);

  }
}

  $('hslider').min=times[0]??DATA.syncN;$('hslider').max=DATA.syncN;$('hslider').value=viewTick;
  $('hslider').disabled=times.length<2;
  $('hlabel').textContent=follow?`实时 · #${viewTick}`:`历史快照 · #${viewTick}`;
  $('hist').classList.toggle('viewing',!follow);
  $('histBtn').classList.toggle('viewing',!follow);
  if(!times.length)$('hlabel').textContent='旧版本未保存完整历史，仅可查看当前结果';
}
function renderNote(){
  $('notebar').textContent=[
    VIEW.note,
    VIEW.coverage?.note,
    (VIEW.children||[]).some(c=>['no-file','ambiguous'].includes(c.matched)||c.events===0)?
      '部分子会话未定位或归属不确定，不能视作完整覆盖。':''
  ].filter(Boolean).join(' · ');
}
let opener=null;
function openDrawer(id){
  if(!VIEW)return tell('尚无摘要可查看。');
  opener=document.activeElement;drawerId=id;
  if(id!=='__LIVE__')selectedId=id;
  renderDrawer();$('drawer').classList.add('open');$('dClose').focus();applyEmphasis();
  if(id!=='__LIVE__')reveal(id);
}
function reveal(id){ // 卡被抽屉盖住时，地图在自身区域内横向滚开，不重排；#room 撑出可滚宽度
  const n=$('c-'+id),dw=$('drawer').offsetWidth;if(!n)return;
  const room=$('room')||$('wrap').appendChild(Object.assign(document.createElement('div'),{id:'room'}));
  n.scrollIntoView({block:'nearest'});room.style.left=(lastW+dw)+'px';
  const over=n.getBoundingClientRect().right-(innerWidth-dw-16);
  if(over>0)$('wrap').scrollLeft+=over;
}
function renderDrawer(){
  const c=byId.get(drawerId),body=$('dBody'),scroll=body.scrollTop;
  if(drawerId==='__LIVE__'){
    const e=liveValue();
    $('dHead').innerHTML='<h3>当前进展全文</h3>';
    body.innerHTML=['now','known','next'].map((k,i)=>
      `<h4>${['正在做','已证实','还差什么'][i]}</h4><p>${esc(e[k]||'未知')}</p>`).join('');
    return;
  }
  if(!c)return closeDrawer(false);
  $('dHead').innerHTML=`<h3>${esc(c.title)}</h3>`+
    `<div class="sub">${types[typeOf(c)]||'记录'} · ${labels[stateAt(c)]||'状态未知'}`+
    ` · ${follow?'当前':'历史快照'} #${viewTick}</div>`;
  const rels=(VIEW.edges||[]).filter(e=>e.f===c.id||e.t===c.id);
  body.innerHTML='<div class="kv"><b>署名</b>'+
    `<span>${(c.sig||[]).map(s=>`${esc(s.verb)}：${esc(s.agent)}`).join('；')||'未知'}</span></div>`+
    `<p>${esc(c.summary||c.sub||'')}</p>`+
    (c.summary&&c.sub&&c.summary!==c.sub?`<p>${esc(c.sub)}</p>`:'')+
    `<div class="kv"><b>关系 ${rels.length}</b></div>`+
    `${rels.map(e=>{
      const id=e.f===c.id?e.t:e.f;
      return `<button class="relrow" data-target="${esc(id)}">`+
        `${e.f===c.id?'→':'←'} ${esc(e.v)} · ${esc(byId.get(id)?.title||id)}</button>`;
    }).join('')}`+
    '<div class="kv"><b>关键事实</b></div>'+
    `<ul>${(c.facts||[]).map(s=>`<li>${esc(s)}</li>`).join('')||'<li>暂无事实记录</li>'}</ul>`+
    ((c.notes||[]).length?'<div class="kv"><b>系统说明</b></div>'+
      `<ul>${c.notes.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'')+
    ((c.steps||[]).length?'<div class="kv"><b>修复过程</b></div><ul>'+
      c.steps.map(s=>`<li>${esc(s.title)} · ${esc(s.who||'署名未知')} · ${esc(labels[s.st]||s.st||'状态未知')}</li>`).join('')+
      '</ul>':'')+
    ((c.acc||[]).length?`<div class="kv"><b>验收条件</b></div><ul>${c.acc.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'')+
    `<div class="evbox mono">来源：${esc(c.ev||'未提供原始记录位置；这是归纳，不等于已核实证据。')}</div>`;
  body.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.target,c=byId.get(id);
    if(!c)return;
    tell('');branchId='';expandedZones.add(String(colIdx(c)));selectedId=id;drawerId=id;
    render();reveal(id);
    $('dClose').focus({preventScroll:true});
  });
  body.scrollTop=scroll;
}
function closeDrawer(focus=true){
  const id=drawerId;drawerId=null;
  $('drawer').classList.remove('open');$('wrap').scrollLeft=0;$('room')?.remove();
  if(focus)($('c-'+id)||(opener?.isConnected?opener:null))?.focus({preventScroll:true});
  applyEmphasis();
}
$('wrap').onclick=e=>{
  if(e.target===$('wrap')||e.target===$('edges')){selectedId=hoveredId=selAgent=null;applyEmphasis();renderSig();}
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(drawerId)closeDrawer();
    else if($('pcPanel').classList.contains('open')){$('pcPanel').classList.remove('open');$('pcAll').focus();}
    else{selectedId=hoveredId=selAgent=null;applyEmphasis();renderSig();}
  }
});
// 下一帧再重绘，避免在尺寸回调里改尺寸触发 ResizeObserver 循环
new ResizeObserver(()=>requestAnimationFrame(()=>{if(VIEW&&Math.abs($('wrap').clientWidth-lastW)>2)render();})).observe($('wrap'));
refresh();
setInterval(refresh,5000);

</script>
</body>
</html>
