<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Session 观察台 · 需求解决地图</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a22; --panel2:#1c212c; --line:#282e3b;
    --tx:#e7eaf0; --muted:#98a1b0; --dim:#626b7a;
    --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --red:#f87171; --teal:#2dd4bf; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Segoe UI",sans-serif}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:60}
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand .tag{font-size:10px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
  /* 会话切换器 */
  .switcher{position:relative}
  #swBtn{display:flex;align-items:center;gap:8px;min-width:190px;justify-content:space-between}
  #swBtn .sid{font-size:12px}
  #swBtn .caret{color:var(--dim);font-size:10px}
  .menu{position:absolute;top:calc(100% + 8px);left:0;width:380px;max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:8px;display:none;z-index:70}
  .menu.open{display:block}
  .swrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .swrow:hover{background:var(--panel2)}
  .swrow.active{border-color:#3b5bdb66;background:#141b2c}
  .swrow .sid{font-size:12.5px;font-weight:600}
  .swrow .meta{font-size:10.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
  .swrow .rm{border:none;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:5px;opacity:0}
  .swrow:hover .rm{opacity:1}
  .swrow .rm:hover{color:var(--red);background:#2a1a1a}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.done{background:var(--green)} .dot.err{background:var(--red)}
  .dot.work{background:var(--blue);animation:blink 1.1s infinite} .dot.empty{background:#475569}
  @keyframes blink{50%{opacity:.25}}
  .swAdd{display:flex;gap:8px;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:6px}
  .swAdd input{flex:1;background:#0b0d12;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px}
  .swAdd button{padding:6px 14px;font-size:12px}
  .controls{display:flex;align-items:center;gap:10px;flex:1}
  button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--blue);color:#fff}
  button.primary{background:#2563eb;border-color:#2563eb;font-weight:600}
  .stamps{margin-left:auto;text-align:right;font-size:10.5px;color:var(--dim);line-height:1.5;white-space:nowrap}
  .stamps b{color:var(--muted)}
  .spin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);animation:blink 1.2s infinite;margin-right:6px}

  .live{display:flex;margin:12px 20px 0;border:1px solid #2b3a55;border-radius:12px;background:linear-gradient(180deg,#141b2a,#12161f);overflow:hidden}
  .live .lhead{flex:0 0 118px;display:flex;align-items:center;justify-content:center;background:#182338;font-weight:700;font-size:13px;color:#9fc1f7;letter-spacing:1px}
  .live .lhead .pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:9px;animation:blink 1.4s infinite}
  .live .lbody{flex:1;display:grid;grid-template-columns:1fr 1.4fr 1fr}
  .live .lcell{padding:10px 16px;border-left:1px solid #223049}
  .live .lcell .k{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-bottom:3px}
  .live .lcell .v{font-size:13px;color:#dbe3ef}

  .sigbar{display:flex;align-items:center;gap:10px;margin:10px 20px 0;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .sigchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--muted)}
  .sigchip.on{border-color:var(--violet);color:#fff;background:#221d38}
  .sigchip .cdot{width:7px;height:7px;border-radius:50%}
  .sigchip .n{font-size:10px;color:var(--dim)}

  .wrap{position:relative;margin:14px 20px 0;border:1px solid var(--line);border-radius:14px;background:radial-gradient(1000px 500px at 22% 0%,#151b28 0%,var(--bg) 65%);overflow:hidden}
  .colhead{position:absolute;top:14px;font-size:11px;color:var(--dim);letter-spacing:2px;z-index:1}
  .zone{position:absolute;left:14px;right:14px;border:1px dashed #232a38;border-radius:12px;pointer-events:none}
  .zone .zh{position:absolute;top:-11px;left:22px;background:var(--bg);padding:0 10px;font-size:11px;color:var(--dim);letter-spacing:2px}
  svg.edges{position:absolute;inset:0;z-index:1;pointer-events:none}
  svg.edges text{font-size:10.5px;font-weight:600;paint-order:stroke;stroke:#0e1014;stroke-width:4px}
  .card{position:absolute;z-index:2;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:9px 12px 7px;cursor:pointer;transition:opacity .5s;overflow:hidden}
  .card.off{opacity:0;pointer-events:none}
  .card:hover{border-color:#465170}
  .card .ctag{display:inline-block;font-size:9.5px;letter-spacing:1px;padding:1px 7px;border-radius:4px;margin-bottom:4px;font-weight:700;background:#232a38}
  .card h4{font-size:13.5px;font-weight:650;line-height:1.3}
  .card .sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
  .card ul.acc{margin:6px 0 2px 16px;font-size:11.5px;color:#c3cbd8}
  .card .sig{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .card .sig span{font-size:10px;color:var(--dim);background:#0d1017;border:1px solid #232a38;border-radius:5px;padding:1px 7px;cursor:pointer}
  .card .sig span b{color:var(--muted);font-weight:600}
  .card .stbadge{position:absolute;top:-9px;right:10px;font-size:9.5px;padding:1px 8px;border-radius:99px;font-weight:700}
  .card.goal{background:linear-gradient(160deg,#17233c,#131a2a);border-color:#3b5bdb88}
  .card.subgoal{border-color:#2c4a7c}
  .card.risk{border-color:#8a6420;background:#1d1a10}
  .card.risk.resolved{border-color:#2f5c48;background:#111b16}
  .card.verify{border-color:#1f4f4a}
  .card.verify.failed{border-color:#7c3333;background:#1d1212}
  .card.concl{background:linear-gradient(160deg,#122019,#101613)}
  .card.concl.partial{background:linear-gradient(160deg,#211f10,#16140d)}
  .card.gap{border-style:dashed;border-color:#3a4459;background:#12141a}
  .st-doing{background:#1e3a5c;color:#93c5fd}.st-done{background:#14532d;color:#86efac}
  .st-failed{background:#5c1d1d;color:#fca5a5}.st-partial{background:#574308;color:#fde68a}
  .st-risk{background:#574308;color:#fde68a}.st-resolved{background:#14532d;color:#86efac}
  .card.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px #60a5fa88}100%{box-shadow:0 0 0 3px transparent}}
  .focusmode .card:not(.hl){opacity:.13;pointer-events:none}
  .focusmode svg.edges path:not(.hl){opacity:.04}
  .focusmode svg.edges text:not(.hl){opacity:.05}

  .rgchip{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;height:100%}
  .rgbody{position:absolute;z-index:5;border:1px solid var(--line);border-radius:10px;background:rgba(16,19,26,.98);padding:10px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .rgstep{display:flex;gap:8px;padding:5px 2px;font-size:11.5px;color:#c3cbd8;cursor:pointer;border-radius:6px;align-items:flex-start}
  .rgstep .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
  .rgstep .who{color:var(--dim);font-size:10px;margin-left:auto;white-space:nowrap}
  .rgarrow{text-align:center;color:#3a4459;font-size:10px;line-height:1;margin:1px 0}

  .hist{display:flex;align-items:center;gap:14px;margin:12px 20px 0;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:12px;color:var(--muted)}
  .hist input[type=range]{flex:1;accent-color:#3b82f6}
  .hist .banner{display:none;align-items:center;gap:10px;background:#3a2b10;border:1px solid #8a6420;color:#fde68a;border-radius:8px;padding:4px 12px;font-size:11.5px;font-weight:600}
  .hist.viewing .banner{display:inline-flex}
  #notebar{margin:10px 20px 0;font-size:11.5px;color:var(--dim)}
  #notebar b{color:var(--muted)}
  #drawer{position:fixed;right:0;top:0;bottom:0;width:368px;background:var(--panel);border-left:1px solid var(--line);z-index:80;padding:20px;transform:translateX(103%);transition:transform .25s;overflow-y:auto}
  #drawer.open{transform:none}
  #drawer h3{font-size:15px;margin-bottom:2px}
  #drawer .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  #drawer .kv{display:flex;gap:8px;font-size:12px;margin:7px 0}
  #drawer .kv b{color:var(--dim);font-weight:500;flex:0 0 78px}
  #drawer .evbox{background:#0b0d12;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;color:#a5b4fc;margin:10px 0;word-break:break-all}
  #drawer ul{margin:6px 0 0 18px;font-size:12.5px;color:#d1d5db}
  #drawer li{margin:4px 0}
  #drawer .close{position:absolute;top:12px;right:12px;border:none;background:none;font-size:18px;color:var(--muted);cursor:pointer}
  #boot{position:fixed;inset:0;background:rgba(10,12,16,.82);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #boot .msg{font-size:15px;color:#c7d2fe}
  #boot .steps{font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">◉ 观察台<span class="tag">需求解决地图</span></div>
  <div class="switcher">
    <button id="swBtn">
      <span class="dot empty" id="swDot"></span>
      <span class="sid mono" id="swLabel">—</span>
      <span class="caret">▼</span>
    </button>
    <div class="menu" id="swMenu">
      <div id="swList"></div>
      <div class="swAdd">
        <input id="swNew" class="mono" placeholder="粘贴 session ID（支持前缀）回车添加" spellcheck="false">
        <button id="swAddBtn">添加</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="primary" id="btnResync">触发同步</button>
    <span id="stat" style="font-size:12px;color:var(--muted)">加载中…</span>
  </div>
  <div class="stamps">
    <div>数据读到 <b class="mono" id="stData">—</b></div>
    <div>摘要更新到 <b class="mono" id="stSum">—</b></div>
  </div>
</div>

<div class="live" id="live">
  <div class="lhead"><span class="pulse"></span>当前进展</div>
  <div class="lbody">
    <div class="lcell"><div class="k">正在做</div><div class="v" id="lvNow">—</div></div>
    <div class="lcell"><div class="k">已知道</div><div class="v" id="lvKnown">—</div></div>
    <div class="lcell"><div class="k" id="lvNextK">下一项验证</div><div class="v" id="lvNext">—</div></div>
  </div>
</div>

<div class="sigbar">
  <span style="letter-spacing:1px;font-size:10.5px">署名视角</span>
  <span id="sigchips" style="display:flex;gap:8px;flex-wrap:wrap"></span>
  <span style="margin-left:auto;font-size:10.5px">点署名高亮该 agent 的全部贡献 · 点卡片看证据链</span>
</div>

<div class="wrap" id="wrap"><svg class="edges" id="edges"></svg></div>
<div id="notebar"></div>

<div class="hist" id="hist">
  <span style="white-space:nowrap">历史滑条</span>
  <input type="range" id="hslider" min="0" max="0" value="0" step="1">
  <span class="mono" id="hlabel">实时 · 同步 #0</span>
  <span class="banner" id="hbanner">正在查看历史 <button id="hback" style="padding:3px 10px;font-size:11px">回到实时</button></span>
</div>

<aside id="drawer">
  <button class="close" id="dClose">✕</button>
  <div id="dBody"></div>
</aside>

<div id="boot"><div class="msg">◉ 正在重建解决地图…</div><div class="steps">解析 JSONL → 拼 agent 树 → LLM 压缩（首次约 1-3 分钟）</div></div>

<script>
/* ═══════ 状态与轮询 ═══════ */
let DATA=null, sessions=[], curSid=null, viewTick=0, follow=true, selAgent=null;
let prevStates=new Map(), prevSyncN=-1, prevSid=null, rgOpen=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function refresh(){
  try{
    const [sr,dr]=await Promise.all([
      fetch('/api/sessions'),
      fetch('/api/data'+(curSid?`?sid=${encodeURIComponent(curSid)}`:'')),
    ]);
    sessions=(await sr.json()).sessions;
    DATA=await dr.json();
  }catch(e){$('stat').textContent='服务未连接';return;}
  if(DATA.error){$('stat').textContent=DATA.error;renderSwitcher();return;}
  const switched=DATA.sessionId!==prevSid;
  if(switched){ // 切换观察者：重置视图态
    viewTick=DATA.syncN;follow=true;selAgent=null;prevStates=new Map();rgOpen=new Set();closeDrawer();
    prevSid=DATA.sessionId;prevSyncN=-1;
  }
  $('boot').style.display=DATA.syncN===0?'flex':'none';
  $('stat').innerHTML=DATA.analyzing?'<span class="spin"></span>分析中…'
    :(DATA.lastError?`<span style="color:var(--red)">上次同步失败</span>`
    :(DATA.syncN===0?'待首次分析':(viewTick<DATA.syncN?`查看历史 · 最新 #${DATA.syncN}`:`实时 · 同步 #${DATA.syncN}`)));
  if(DATA.syncN>0){render(DATA.syncN!==prevSyncN);$('boot').style.display='none';}
  prevSyncN=DATA.syncN;
  renderSwitcher();
}
setInterval(refresh,5000);

/* ═══════ 切换器 ═══════ */
$('swBtn').onclick=e=>{e.stopPropagation();$('swMenu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('.switcher'))$('swMenu').classList.remove('open');});
function renderSwitcher(){
  const cur=DATA?.sessionId;
  $('swLabel').textContent=cur?cur.slice(0,8)+'…':'—';
  const o=sessions.find(s=>s.sid===cur);
  $('swDot').className='dot '+(o?(o.analyzing?'work':(o.lastError?'err':(o.syncN>0?'done':'empty'))):'empty');
  $('swList').innerHTML=sessions.map(s=>{
    const cls=s.sid===cur?' active':'';
    const st=s.analyzing?'work':(s.lastError?'err':(s.syncN>0?'done':'empty'));
    return `<div class="swrow${cls}" data-sid="${esc(s.sid)}">
      <span class="dot ${st}"></span>
      <span class="sid mono">${esc(s.short)}…</span>
      <span class="meta">#${s.syncN} · ${s.cards}卡 · ${s.children}子agent${s.analyzing?' · 分析中':''}${s.lastError?' · 出错':''}</span>
      <button class="rm" data-rm="${esc(s.sid)}" title="停止观察">✕</button>
    </div>`;
  }).join('')||'<div style="padding:10px;color:var(--dim);font-size:12px">暂无观察者，请在下方添加 session ID</div>';
  $('swList').querySelectorAll('.swrow').forEach(r=>r.onclick=e=>{
    if(e.target.dataset.rm)return;
    curSid=r.dataset.sid;follow=true;$('swMenu').classList.remove('open');refresh();
  });
  $('swList').querySelectorAll('.rm').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    await fetch('/api/sessions/remove',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.rm})});
    if(b.dataset.rm===curSid)curSid=null;
    refresh();
  });
}
async function addSession(){
  const v=$('swNew').value.trim();if(!v)return;
  $('swNew').value='';
  const r=await fetch('/api/sessions/add',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:v})});
  const j=await r.json();
  if(j.sid){curSid=j.sid;follow=true;}
  refresh();
}
$('swAddBtn').onclick=addSession;
$('swNew').addEventListener('keydown',e=>{if(e.key==='Enter')addSession();});

$('btnResync').onclick=()=>fetch('/api/resync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:curSid})});
$('hslider').addEventListener('input',e=>{viewTick=+e.target.value;follow=viewTick>=DATA.syncN;render(false);});
$('hback').onclick=()=>{viewTick=DATA.syncN;follow=true;render(false);};
$('dClose').onclick=closeDrawer;
$('wrap').addEventListener('click',e=>{if(e.target===$('wrap')||e.target.tagName==='svg'){selAgent=null;render(false);closeDrawer();}});

/* ═══════ 布局引擎（schema 驱动） ═══════ */
const COL={goal:{x:26,w:270},subgoal:{x:336,w:250},mid:{x:626,w:300},verify:{x:956,w:300},concl:{x:1290,w:270}};
const H={subgoal:92,change:92,risk:92,group:44,verify:108,concl:112,gap:64};
const colOf=t=>({goal:'goal',subgoal:'subgoal',change:'mid',risk:'mid',group:'mid',verify:'verify',concl:'concl',gap:'concl'}[t]||'mid');
const colIdx=t=>({goal:0,subgoal:1,change:2,risk:2,group:2,verify:3,concl:4,gap:4}[t]??2);
const stTxt={doing:'进行中',done:'已证实',failed:'失败',partial:'部分证实',risk:'待确认',resolved:'已解决'};
const tagColor={goal:'#9fc1f7',subgoal:'#9fc1f7',change:'#b7c0cf',risk:'#fde68a',verify:'#7ee6d8',concl:'#86efac',gap:'#9aa3b2'};
const COLX=[26,336,626,956,1290];
const visibleAt=(c,t)=>(c.born??0)<=t;
function stateAt(c,t){const a=c.states||[];let s=a.length?a[0].s:'doing';for(const x of a)if(x.at<=t)s=x.s;return s;}
const pH=c=>c.type==='group'?44:(H[c.type]||90);

function layout(){
  const D=DATA,t=viewTick;
  const all=[D.goal,...D.cards].filter(c=>visibleAt(c,t));
  const zones=[];
  for(const c of D.cards.filter(x=>x.type==='subgoal'&&visibleAt(x,t))){
    if(c.title&&!zones.includes(c.title))zones.push(c.title);
  }
  const groups={};zones.forEach(z=>groups[z]={mid:[],verify:[],concl:[],sub:null});
  const others=[];
  for(const c of all){
    if(c.id==='GOAL')continue;
    if(c.type==='subgoal'){if(groups[c.title])groups[c.title].sub=c;else others.push(c);continue;}
    if(c.zone&&groups[c.zone]){
      if(['change','risk','group'].includes(c.type))groups[c.zone].mid.push(c);
      else if(c.type==='verify')groups[c.zone].verify.push(c);
      else groups[c.zone].concl.push(c);
    }else others.push(c);
  }
  const gaps=all.filter(c=>c.type==='gap');
  const pos={};let y=76;const zoneRects=[];
  const stack=(cards,colKey,startY)=>{let cy=startY;for(const c of cards){pos[c.id]={...COL[colKey],y:cy};cy+=pH(c)+12;}return cy;};
  for(const z of zones){
    const g=groups[z];const zoneTop=y;
    const ys={subgoal:zoneTop+26,mid:zoneTop+26,verify:zoneTop+26,concl:zoneTop+26};
    if(g.sub){pos[g.sub.id]={...COL.subgoal,y:ys.subgoal};ys.subgoal+=pH(g.sub)+12;}
    ys.mid=stack(g.mid,'mid',ys.mid);
    ys.verify=stack(g.verify,'verify',ys.verify);
    ys.concl=stack(g.concl,'concl',ys.concl);
    const h=Math.max(ys.subgoal,ys.mid,ys.verify,ys.concl)-zoneTop;
    zoneRects.push({z,top:zoneTop,h});y+=Math.max(h,120)+30;
  }
  if(others.length){
    const zoneTop=y;const ys={mid:zoneTop+26,verify:zoneTop+26,concl:zoneTop+26};
    ys.mid=stack(others.filter(c=>['change','risk','group'].includes(c.type)),'mid',ys.mid);
    ys.verify=stack(others.filter(c=>c.type==='verify'),'verify',ys.verify);
    ys.concl=stack(others.filter(c=>['concl'].includes(c.type)),'concl',ys.concl);
    const h=Math.max(ys.mid,ys.verify,ys.concl)-zoneTop;
    zoneRects.push({z:'其它',top:zoneTop,h});y+=Math.max(h,120)+30;
  }
  for(const c of gaps){pos[c.id]={...COL.concl,y};y+=pH(c)+12;}
  if(D.goal&&visibleAt(D.goal,t))pos.GOAL={...COL.goal,y:76+Math.max((y-76-190)/2,0)};
  return {pos,zoneRects,canvasH:y+34};
}

function render(animate){
  const D=DATA;if(!D||!D.syncN)return;
  viewTick=Math.max(0,Math.min(viewTick??D.syncN,D.syncN));
  if(follow)viewTick=D.syncN;
  const {pos,zoneRects,canvasH}=layout();
  const wrap=$('wrap');wrap.style.height=canvasH+'px';
  wrap.querySelectorAll('.card,.zone,.rgbody,.colhead').forEach(n=>n.remove());
  const esvg=$('edges');esvg.setAttribute('width',wrap.clientWidth);esvg.setAttribute('height',canvasH);
  ['目标 · 验收条件','子目标','方案 · 修改 · 风险','验证 · 证据','已证实 · 缺口'].forEach((s,i)=>{
    const d=document.createElement('div');d.className='colhead';d.style.left=COLX[i]+'px';d.textContent=s;wrap.appendChild(d);
  });
  for(const zr of zoneRects){
    const d=document.createElement('div');d.className='zone';
    d.style.cssText+=`top:${zr.top}px;height:${zr.h}px`;
    d.innerHTML=`<span class="zh">子目标 · ${esc(zr.z)}</span>`;
    wrap.appendChild(d);
  }
  const t=viewTick;
  for(const c of [D.goal,...D.cards]){
    if(!pos[c.id])continue;
    const vis=visibleAt(c,t), st=stateAt(c,t);
    const d=document.createElement('div');
    d.className='card '+c.type+(st==='resolved'?' resolved':'')+(st==='failed'?' failed':'')+(st==='partial'?' partial':'')+(vis?'':' off');
    d.id='c-'+c.id;
    d.style.cssText=`left:${pos[c.id].x}px;top:${pos[c.id].y}px;width:${pos[c.id].w}px;height:${pH(c)}px`;
    const badge=vis&&stTxt[st]?`<span class="stbadge st-${st}">${stTxt[st]}</span>`:'';
    const ctag=c.id==='GOAL'?'目标':({subgoal:'子目标',change:'方案',risk:'风险',verify:'验证',concl:'结论',gap:'缺口',group:'过程'}[c.type]||c.type);
    let html=`${badge}<span class="ctag" style="color:${tagColor[c.type]}">${ctag}</span><h4>${esc(c.title)}</h4>`;
    if(c.sub)html+=`<div class="sub">${esc(c.sub)}</div>`;
    if(c.acc&&c.id==='GOAL')html+=`<ul class="acc">${c.acc.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`;
    if(c.sig&&c.sig.length)html+=`<div class="sig">${c.sig.map(g=>`<span data-agent="${esc(g.agent)}">${esc(g.verb)} · <b>${esc(g.agent)}</b></span>`).join('')}</div>`;
    d.innerHTML=html;
    d.addEventListener('click',e=>{
      if(e.target.dataset.agent){selAgent=e.target.dataset.agent;render(false);e.stopPropagation();return;}
      if(c.type==='group'){rgOpen.has(c.id)?rgOpen.delete(c.id):rgOpen.add(c.id);render(false);e.stopPropagation();return;}
      openDrawer(c);
    });
    wrap.appendChild(d);
    if(animate&&prevStates.has(c.id)&&prevStates.get(c.id)!==st&&vis)d.classList.add('flash');
    if(vis)prevStates.set(c.id,st);
  }
  for(const c of D.cards.filter(x=>x.type==='group'&&rgOpen.has(x.id)&&pos[x.id]&&visibleAt(x,t))){
    const p=pos[c.id];
    const body=document.createElement('div');body.className='rgbody';
    body.style.cssText=`left:${p.x}px;top:${p.y+50}px;width:${p.w}px`;
    body.innerHTML=(c.steps||[]).map((s,i)=>`${i?'<div class="rgarrow">▼</div>':''}
      <div class="rgstep"><span class="dot" style="background:${{done:'#34d399',failed:'#f87171',doing:'#60a5fa'}[s.st]||'#60a5fa'}"></span>
      <span>${esc(s.title)}</span><span class="who">${esc(s.who||'')}</span></div>`).join('');
    wrap.appendChild(body);
  }
  drawEdges(pos,t);
  renderSig(t);renderLive(t);renderHist(t);
  $('notebar').innerHTML=`${D.note?`<b>地图备注</b> ${esc(D.note)} · `:''}<b>子会话</b> ${(D.children||[]).map(c=>`${esc(c.key)}(${c.kind},${c.events}事件${c.matched==='no-file'?',未定位到文件':''})`).join(' · ')||'—'}${D.lastError?` · <span style="color:var(--red)">错误: ${esc(D.lastError)}</span>`:''}`;
}

/* ═══════ 边 ═══════ */
function drawEdges(pos,t){
  const esvg=$('edges');esvg.innerHTML='';
  const D=DATA;
  const anchor=(c,side)=>{const p=pos[c.id];if(!p)return null;
    const m={l:[p.x,p.y+pH(c)/2],r:[p.x+p.w,p.y+pH(c)/2],t:[p.x+p.w/2,p.y],b:[p.x+p.w/2,p.y+pH(c)]};return m[side];};
  const verbColor={拆成:'#5f6b7e',采用:'#5f6b7e',检查:'#5f6b7e',妨碍:'#fbbf24',解决:'#34d399',支持:'#2dd4bf','留下缺口':'#6b7280'};
  for(const e of D.edges){
    if((e.born??0)>t)continue;
    const f=[D.goal,...D.cards].find(c=>c.id===e.f),tt=[D.goal,...D.cards].find(c=>c.id===e.t);
    if(!f||!tt||!pos[e.f]||!pos[e.t])continue;
    const cf=colIdx(f.type),ct=colIdx(tt.type);
    let fa,ta;
    if(cf<ct){fa='r';ta='l';}else if(cf>ct){fa='l';ta='r';}else{fa=pos[e.f].y<pos[e.t].y?'b':'t';ta=pos[e.f].y<pos[e.t].y?'t':'b';}
    const a=anchor(f,fa),b2=anchor(tt,ta);if(!a||!b2)continue;
    const hor=fa==='l'||fa==='r';
    const c1=hor?[a[0]+(b2[0]>a[0]?40:-40),a[1]]:[a[0],a[1]+(b2[1]>a[1]?40:-40)];
    const c2=hor?[b2[0]-(b2[0]>a[0]?40:-40),b2[1]]:[b2[0],b2[1]-(b2[1]>a[1]?40:-40)];
    const kind=(e.v==='妨碍'||e.v==='留下缺口')?'risk':((e.v==='解决'||e.v==='支持')?'solve':'flow');
    const col=kind==='risk'?'#fbbf24':kind==='solve'?'#34d399':'#5f6b7e';
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${a[0]} ${a[1]} C ${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${b2[0]} ${b2[1]}`);
    p.setAttribute('fill','none');p.setAttribute('stroke',col);p.setAttribute('stroke-width','1.7');
    if(kind==='risk')p.setAttribute('stroke-dasharray','5 4');
    p.dataset.f=e.f;p.dataset.t=e.t;
    esvg.appendChild(p);
    const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('x',(a[0]+b2[0])/2+(hor?0:16));tx.setAttribute('y',(a[1]+b2[1])/2+(hor?-8:0));
    tx.setAttribute('text-anchor','middle');tx.setAttribute('fill',verbColor[e.v]||col);
    tx.textContent=e.v;tx.dataset.f=e.f;tx.dataset.t=e.t;
    esvg.appendChild(tx);
  }
  applyFocus();
}

/* ═══════ 署名视角 ═══════ */
function renderSig(t){
  const D=DATA;const m=new Map();
  for(const c of [D.goal,...D.cards])if(visibleAt(c,t))for(const g of c.sig||[]){
    if(!m.has(g.agent))m.set(g.agent,{count:0,color:(D.agents.find(a=>a.key===g.agent)||{}).color||'#98a1b0'});
    m.get(g.agent).count++;
  }
  $('sigchips').innerHTML=[...m.entries()].map(([k,v])=>
    `<span class="sigchip${selAgent===k?' on':''}" data-k="${esc(k)}"><span class="cdot" style="background:${v.color}"></span>${esc(k)}<span class="n">${v.count}卡</span></span>`).join('');
  $('sigchips').querySelectorAll('.sigchip').forEach(ch=>ch.onclick=e=>{e.stopPropagation();selAgent=selAgent===ch.dataset.k?null:ch.dataset.k;render(false);});
}
function applyFocus(){
  const esvg=$('edges');
  document.querySelectorAll('#wrap .card').forEach(n=>n.classList.remove('hl'));
  esvg.querySelectorAll('.hl').forEach(n=>n.classList.remove('hl'));
  if(!selAgent){$('wrap').classList.remove('focusmode');return;}
  $('wrap').classList.add('focusmode');
  const hlIds=new Set();
  for(const c of [DATA.goal,...DATA.cards])if((c.sig||[]).some(g=>g.agent===selAgent))hlIds.add(c.id);
  hlIds.forEach(id=>{const n=$('c-'+id);if(n)n.classList.add('hl');});
  esvg.querySelectorAll('path,text').forEach(p=>{
    if(hlIds.has(p.dataset.f)||hlIds.has(p.dataset.t))p.classList.add('hl');
  });
}

/* ═══════ 当前进展 / 历史 / 抽屉 ═══════ */
function renderLive(t){
  const D=DATA;let e=D.live[0]||{};
  for(const x of D.live)if(x.at<=t)e=x;
  $('lvNow').innerHTML=esc(e.now||'—');
  $('lvKnown').innerHTML=esc(e.known||'—');
  $('lvNextK').textContent=e.nextK||'下一项验证';
  $('lvNext').innerHTML=esc(e.next||'—');
  const st=(D.stamps||[]).find(s=>s.at===t)||D.stamps[D.stamps.length-1]||{};
  $('stData').textContent=st.data||'—';$('stSum').textContent=st.summary||'—';
}
function renderHist(t){
  const D=DATA;const hs=$('hslider');hs.max=D.syncN;hs.value=t;
  $('hlabel').textContent=t<D.syncN?`历史 · 同步 #${t}`:`实时 · 同步 #${D.syncN}`;
  $('hist').classList.toggle('viewing',t<D.syncN);
}
function openDrawer(c){
  const st=stateAt(c,viewTick);
  $('dBody').innerHTML=`<h3>${esc(c.title)}</h3><div class="sub">${esc(c.zone||'')} · 状态：${stTxt[st]||st}</div>
    ${(c.sig&&c.sig.length)?`<div class="kv"><b>署名</b><span>${c.sig.map(g=>`${esc(g.verb)}：${esc(g.agent)}`).join('；')}</span></div>`:''}
    <div class="evbox mono">${esc(c.ev||'—')}</div>
    <div class="kv"><b>关键事实</b></div>
    <ul>${(c.facts||[]).map(f=>`<li>${esc(f)}</li>`).join('')||'<li>—</li>'}</ul>
    ${(c.steps&&c.steps.length)?`<div class="kv" style="margin-top:10px"><b>过程</b></div><ul>${c.steps.map(s=>`<li>${esc(s.title)}（${esc(s.who||'')}·${esc(s.st||'')}）</li>`).join('')}</ul>`:''}
    ${c.acc?`<div class="kv" style="margin-top:10px"><b>验收条件</b></div><ul>${c.acc.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}`;
  $('drawer').classList.add('open');
}
function closeDrawer(){$('drawer').classList.remove('open');}
</script>
